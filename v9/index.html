            cor:'#c0392b', botao:'Atualizar Painel Geekie', minutos:'8 a 10 minutos',
            aviso:'Reescreve as atividades, o desempenho e o engajamento do Geekie.' },
  active: { nome:'ActiveSoft', source:'activesoft_all', url:'https://siga02.activesoft.com.br/info/',
            cor:'#2563eb', botao:'Atualizar Painel Active', minutos:'3 a 5 minutos',
            aviso:'Reescreve as notas (AE1/AE2/AQ e recuperações), os responsáveis, as faltas e as ocorrências disciplinares do painel.' }
};

async function retratoDe(source) {
  try {
    const r = await fetch(SB_URL+'/rest/v1/habilis_painel_cripto?select=updated_at&source=eq.'+source+'&order=updated_at.desc&limit=1',
      {headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY}, cache:'no-store'});
    const j = await r.json();
    return (j[0] && j[0].updated_at) || null;
  } catch(e) { return null; }
}

function desdeTexto(iso) {
  if (!iso) return 'sem registro';
  const h = (Date.now() - new Date(iso).getTime()) / 36e5;
  const d = new Date(iso).toLocaleDateString('pt-BR') + ' às ' + new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if (h < 1) return 'há poucos minutos (' + d + ')';
  if (h < 24) return 'há ' + Math.round(h) + 'h (' + d + ')';
  return 'há ' + Math.round(h/24) + ' dia(s) — ' + d;
}

async function marcarRetratos() {
  for (const [k, f] of Object.entries(FONTES)) {
    const iso = await retratoDe(f.source);
    const dot = $(k==='geekie' ? '#dotGeekie' : '#dotActive');
    const btn = $(k==='geekie' ? '#updGeekieBtn' : '#updActiveBtn');
    if (!dot || !btn) continue;
    const velho = !iso || (Date.now() - new Date(iso).getTime()) > 36*36e5;
    dot.classList.toggle('old', velho);
    btn.title = f.nome + ' — última atualização ' + desdeTexto(iso) + (velho ? ' · vale atualizar' : '');
  }
}

function openUpdateModal(chave) {
  const f = FONTES[chave];
  const bg = el('div',{class:'modal-bg'});
  bg.innerHTML = `<div class="modal" style="width:min(540px,94vw)">
    <h3 style="color:${f.cor}">${f.botao}</h3>
    <div class="muted" style="font-size:.85rem">${esc(f.aviso)} Leva ${f.minutos}.</div>
    <ol class="steps">
      <li><b>Só na primeira vez:</b> arraste este botão para a sua barra de favoritos do Chrome.<br>
        <a class="bmk" id="bmkLink" href="${BOOKMARKLET}" draggable="true">⚡ Atualizar Habilis</a>
        <div class="muted" style="font-size:.75rem;margin-top:5px" id="bmkDica">Se a barra estiver escondida: Ctrl/⌘ + Shift + B. · <a href="#" id="bmkCopy">copiar o endereço do favorito</a></div></li>
      <li>Abra o ${f.nome} <b>já logado</b>:
        <div style="margin-top:6px"><button class="primary" id="abrirSistema" style="background:${f.cor};border-color:${f.cor}">Abrir o ${f.nome}</button></div></li>
      <li>Lá dentro, clique no favorito <b>⚡ Atualizar Habilis</b> e acompanhe a janelinha no canto.</li>
      <li>Volte para cá — este painel recarrega sozinho quando o retrato novo chegar.</li>
    </ol>
    <div class="updStatus" id="updStatus"><span class="spin"></span><span id="updStatusTxt">Último retrato do ${f.nome}: carregando…</span></div>
    <div class="row"><button class="ghost" id="updFechar">Fechar</button></div>
  </div>`;
  document.body.appendChild(bg);

  const txt = bg.querySelector('#updStatusTxt');
  let inicial = null, timer = null, tentativas = 0;

  retratoDe(f.source).then(iso => {
    inicial = iso;
    txt.textContent = 'Último retrato do ' + f.nome + ': ' + desdeTexto(iso) + '. Aguardando a atualização…';
  });

  bg.querySelector('#abrirSistema').onclick = () => window.open(f.url, '_blank', 'noopener');

  bg.querySelector('#bmkLink').onclick = (e) => {
    e.preventDefault();
    bg.querySelector('#bmkDica').innerHTML = '<b>Arraste</b> o botão até a barra de favoritos — clicar aqui não faz nada, ' +
      'porque ele só funciona dentro do Geekie ou do ActiveSoft.';
  };
  bg.querySelector('#bmkCopy').onclick = async (e) => {
    e.preventDefault();
    try {
      await navigator.clipboard.writeText(BOOKMARKLET);
      e.target.textContent = 'copiado! crie um favorito e cole isso no campo de endereço';
    } catch (err) { e.target.textContent = 'não consegui copiar — arraste o botão'; }
  };

  const parar = () => { if (timer) clearInterval(timer); timer = null; };
  bg.querySelector('#updFechar').onclick = () => { parar(); bg.remove(); marcarRetratos(); };

  timer = setInterval(async () => {
    tentativas++;
    if (tentativas > 240) { parar(); txt.textContent = 'Parei de observar. Feche e abra de novo quando for atualizar.'; return; }
    const iso = await retratoDe(f.source);
    if (iso && inicial && iso !== inicial) {
      parar();
      bg.querySelector('.spin').remove();
      txt.textContent = 'Retrato novo recebido. Recarregando o painel…';
      setTimeout(() => location.reload(), 1200);
    }
  }, 10000);
}


(async () => {
  try {
    await loadData();
    /* descompacta students: [idx, fez, resp, acertos] -> objetos */
    const SLIST = DATA.students_list;
    DATA.gk_acts.forEach(a => { a.students = a.students.map(r => ({m: SLIST[r[0]].id, nome: SLIST[r[0]].nome, fez: r[1], resp: r[2], acertos: r[3]})); });
    DATA.gk_acts.sort((a,b)=> a.end.localeCompare(b.end));
    buildAlunosIndex();
    EXTRACTED_STR = new Date(DATA.extraido_em+'T12:00:00').toLocaleDateString('pt-BR');
    state.tab = 'home';
    render();
    placeLogoDots();
    marcarRetratos();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeLogoDots);
    await buildHashes();
    await loadAgenda();
    if (state.tab==='busca') render();
  } catch (e) {
    telaCarregando('Não foi possível carregar os dados (' + String(e) + '). Verifique sua conexão e recarregue a página.');
    console.error(e);
  }
})();
</script>
