<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habilis · Direção de Desempenho</title>

<!-- v7 (06/10/2026): notas de recuperação e média pós-recuperação (Notas e Exportar relatório) + aba Recuperação -->

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --surface-2: #f4f3f0; --card: #ffffff;
    --ink: #1c1c1c; --ink-2: #52514e; --ink-3: #8a897f;
    --brand-yellow: #f9b233; --brand-magenta: #a93a8d; --brand-teal: #52a8b0; --brand-dark: #262626;
    --s-bessa: #eda100; --s-sul: #a93a8d;
    --flag-bad: #c92a3d; --flag-bad-bg: #fdeef0; --flag-warn-bg: #fdf6e4; --warn: #a86a00;
    --ok: #0b7a3e; --ok-bg: #eaf6ef;
    --line: #e6e4de; --radius: 12px;
    font-size: 15px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --surface: #17171c; --surface-2: #1f1f26; --card: #22222a;
    --ink: #f4f4f0; --ink-2: #c3c2b7; --ink-3: #8a897f;
    --brand-dark: #101014;
    --s-bessa: #c98500; --s-sul: #c355a5;
    --flag-bad: #ff7b8a; --flag-bad-bg: #3a2027; --flag-warn-bg: #33301f; --warn: #f0b95a;
    --ok: #58c98a; --ok-bg: #1d3226;
    --line: #34343c;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--surface); color: var(--ink); }
  header { background: var(--card); color: var(--ink); padding: 12px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size: 1.05rem; margin:0; font-weight:700; }
  header .sub { font-size:.8rem; color: var(--ink-2); }
  header .spacer { flex:1; }
  header button.theme, button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink-2); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:.85rem; }
  /* botões de atualização do retrato */
  header button.upd { border:0; color:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:.85rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  header button.upd:hover { filter:brightness(1.08); }
  header button.upd .dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.55); }
  header button.upd .dot.old { background:#ffd84d; box-shadow:0 0 0 3px rgba(255,216,77,.25); }
  header button.updGeekie { background:#c0392b; }
  header button.updActive { background:#2563eb; }
  .steps { counter-reset:st; margin:14px 0 0; padding:0; list-style:none; }
  .steps li { counter-increment:st; position:relative; padding:0 0 12px 30px; font-size:.9rem; }
  .steps li::before { content:counter(st); position:absolute; left:0; top:0; width:20px; height:20px; border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--ink-2); font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  a.bmk { display:inline-block; background:#11161d; color:#e7edf5; text-decoration:none; font-weight:700; font-size:.85rem; padding:7px 13px; border-radius:8px; cursor:grab; border:1px dashed #52a8b0; }
  .updStatus { margin-top:14px; padding:10px 12px; border-radius:9px; background:var(--surface); border:1px solid var(--line); font-size:.85rem; display:flex; align-items:center; gap:9px; }
  .updStatus .spin { width:13px; height:13px; border:2px solid var(--line); border-top-color:#52a8b0; border-radius:50%; animation:spin 1s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .brandstripe { height:5px; display:flex; }
  .brandstripe span { flex:1; }

  .brandstripe span:nth-child(2){ background:var(--brand-magenta); }
  .brandstripe span:nth-child(3){ background:var(--brand-teal); }

  .filters { display:flex; gap:10px; padding: 14px 22px; flex-wrap: wrap; align-items:flex-end; background:var(--surface); position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line); }
  .filters label { display:flex; flex-direction:column; font-size:.72rem; color:var(--ink-2); gap:4px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
  .filters select, .filters input, select.inline, input.inline { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:.9rem; min-width:120px; }
  select.inline, input.inline { font-size:.82rem; padding:4px 8px; min-width:0; }
  main { padding: 18px 22px 60px; max-width: 1400px; margin: 0 auto; }
  h2 { font-size:1.15rem; margin: 18px 0 4px; }
  h3 { font-size:.98rem; margin: 20px 0 8px; }
  h4 { font-size:.9rem; margin: 14px 0 6px; color: var(--ink-2); }

  .card:nth-child(even) { border-top-color: var(--brand-magenta); }

  .card .v { font-size:1.7rem; font-weight:750; margin-top:2px; font-variant-numeric: tabular-nums; }
  .card .d { font-size:.78rem; color:var(--ink-3); margin-top:2px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin: 12px 0; overflow-x:auto; }
  .legend { display:flex; gap:16px; align-items:center; font-size:.82rem; color:var(--ink-2); margin: 6px 0 10px; flex-wrap:wrap; }
  .legend .sw, .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  table.grid { border-collapse: separate; border-spacing:0; font-size:.85rem; min-width: 100%; }
  table.grid th, table.grid td { padding: 6px 9px; border-bottom: 1px solid var(--line); text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  table.grid th { color: var(--ink-2); font-size:.74rem; text-transform:uppercase; letter-spacing:.3px; position:sticky; top:0; background:var(--card); z-index:3; }
  table.grid th:first-child, table.grid td:first-child { text-align:left; position:sticky; left:0; background:var(--card); z-index:2; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  table.grid th:first-child { z-index:4; }
  table.grid tr:hover td { background: var(--surface-2); }
  table.grid td.hm { text-align:center; min-width:44px; }
  table.grid tr.foot td { font-weight:700; border-top:2px solid var(--line); }
  table.grid td.wrap { white-space:normal; text-align:left; max-width:520px; }
  .bad { color: var(--flag-bad); font-weight:700; }
  .warnc { color: var(--warn); font-weight:700; }
  .badge { display:inline-block; border-radius: 20px; padding: 2px 10px; font-size:.75rem; font-weight:600; }
  .badge.bad { background:var(--flag-bad-bg); color:var(--flag-bad); }

  .badge.warn { background:var(--flag-warn-bg); color:var(--warn); }
  .badge.neutral { background:var(--surface-2); color:var(--ink-2); }
  .flagcard { border-left: 4px solid var(--flag-bad); }
  .flagcard.sched { border-left-color: var(--brand-teal); opacity:.85; }
  .flaglist { display:grid; grid-template-columns: repeat(auto-fill,minmax(330px,1fr)); gap:10px; }
  .flaglist .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:.86rem; }
  .flaglist .item b { display:block; margin-bottom:3px; }
  .flaglist .why { color:var(--ink-2); font-size:.8rem; }
  .flaglist .actions { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button.primary { background:var(--brand-yellow); color:#262626; border:none; border-radius:8px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:.82rem; }
  button.primary.teal { background:var(--brand-teal); color:#fff; }
  button.primary.magenta { background:var(--brand-magenta); color:#fff; }
  button.primary:disabled { opacity:.5; cursor:default; }
  .tooltip { position:fixed; pointer-events:none; background:var(--ink); color:var(--surface); padding:8px 11px; border-radius:8px; font-size:.8rem; z-index:99; max-width:360px; opacity:0; transition:opacity .08s; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .tooltip b { display:block; }
  svg.chart text { fill: var(--ink-2); font-size: 11px; }
  svg.chart .gridline { stroke: var(--line); stroke-dasharray: 2 3; }
  svg.chart .val { fill: var(--ink); font-weight:600; }
  .daygrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .daycell { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-height:74px; }
  .daycell.today { outline: 2px solid var(--brand-yellow); }
  .daycell .dt { font-size:.72rem; font-weight:700; color:var(--ink-2); margin-bottom:5px; }
  .chip { display:inline-block; font-size:.7rem; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:1px 8px; margin:1px 2px 1px 0; }
  .chip.bessa { border-left:3px solid var(--s-bessa); }
  .chip.sul { border-left:3px solid var(--s-sul); }
  .chip.casa { border-right:3px solid var(--brand-teal); }
  .chip.sala { border-right:3px solid var(--brand-magenta); }
  .muted { color: var(--ink-3); }
  .notice { background: var(--flag-warn-bg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:.83rem; color:var(--ink-2); margin: 10px 0; }
  .statgrid td.big { font-weight: 750; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 8px 0 12px; font-size:.85rem; }
  .toolbar label { display:flex; gap:6px; align-items:center; color:var(--ink-2); font-size:.8rem; }
  .oc-item { border-bottom:1px solid var(--line); padding:8px 0; font-size:.85rem; }
  .oc-item .meta { color:var(--ink-2); font-size:.78rem; }
  .oc-item .txt { white-space:pre-wrap; margin-top:4px; color:var(--ink); }
  details summary { cursor:pointer; }
  /* modal */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:150; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 24px; width:min(460px, 92vw); box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .modal h3 { margin:0 0 10px; }
  .modal label { display:block; font-size:.78rem; color:var(--ink-2); margin:10px 0 4px; font-weight:600; }
  .modal input, .modal textarea, .modal select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-size:.9rem; font-family:inherit; }
  .modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  /* relatório */
  .report { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:28px 32px; max-width:980px; margin:12px auto; }
  .report .rhead { display:flex; align-items:center; gap:16px; border-bottom:3px solid var(--brand-yellow); padding-bottom:12px; margin-bottom:14px; }
  .report .rhead h2 { margin:0; font-size:1.3rem; }
  .report .rhead .sub { color:var(--ink-2); font-size:.85rem; }
  .report h3 { border-left:4px solid var(--brand-magenta); padding-left:8px; margin-top:22px; }
  .report table.grid { font-size:.82rem; }
  .report .analysis { white-space:pre-wrap; font-size:.9rem; line-height:1.55; background:var(--surface-2); border-radius:10px; padding:14px 16px; }
  .report .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .report .kpi { border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .report .kpi .k { font-size:.7rem; text-transform:uppercase; color:var(--ink-2); font-weight:700; letter-spacing:.4px; }
  .report .kpi .v { font-size:1.35rem; font-weight:750; }
  /* ---- Relatório à família (v8) ---- */
  .fam-form .fam-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 14px; }
  .fam-form label { display:flex; flex-direction:column; gap:4px; font-size:.78rem; color:var(--ink-2); font-weight:600; }
  .fam-form input, .fam-form select, .fam-form textarea { padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-size:.86rem; font-family:inherit; font-weight:400; }
  .fam-wrap { overflow-x:auto; padding:10px 0 30px; }
  .fam-report { --ft:#51A8B1; --fy:#FBB030; --fm:#A53692; --fg:#6B7280; --fink:#333; --fmuted:#6B7280; --fline:#E5E7EB; --fbg:#F6F7F9; font-family:"Poppins","Segoe UI",system-ui,sans-serif; color:var(--fink); font-size:10.2pt; line-height:1.45; width:210mm; margin:0 auto; color-scheme:light; }
  .fam-report * { box-sizing:border-box; }
  .fam-report .fpage { width:210mm; height:297mm; padding:14mm 16mm 16mm; position:relative; page-break-after:always; break-after:page; overflow:hidden; background:#fff; margin:0 auto 14px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
  .fam-report .fpage:last-child { page-break-after:auto; }
  .fam-report footer { position:absolute; left:16mm; right:16mm; bottom:8mm; display:flex; justify-content:space-between; font-size:7.5pt; color:var(--fmuted); border-top:1px solid var(--fline); padding-top:4px; }
  .fam-report h2 { font-size:19pt; margin:0; line-height:1.15; font-weight:700; color:var(--fink); border:none; padding:0; }

  .fam-report h4 { margin:0 0 4px; font-size:10.5pt; }
  .fam-report p { margin:0 0 8px; text-align:justify; }
  .fam-report .fkicker { text-transform:uppercase; letter-spacing:.12em; font-size:7.5pt; color:var(--fm); font-weight:600; margin-bottom:2px; }
  .fam-report .fhead { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--fy); padding-bottom:8px; margin-bottom:12px; }
  .fam-report .fminilogo { height:40px; }
  .fam-report .flead { color:#374151; }

  .fam-report .fmuted { color:var(--fmuted); }

  .fam-report .flogo { width:200px; margin-bottom:26px; }

  .fam-report .fcover-sub { margin-top:20px; font-size:11pt; color:#374151; text-align:center; }
  .fam-report .fcover-box { display:flex; gap:18px; margin-top:34px; width:100%; }

  .fam-report .fcover-box div:nth-child(2) { border-top-color:var(--fy); } .fam-report .fcover-box div:nth-child(3) { border-top-color:var(--fm); }

  .fam-report .fhowto { background:var(--fbg); border-radius:10px; padding:10px 14px 6px; margin-top:10px; } .fam-report .fhowto h3 { margin:0 0 4px; font-size:10pt; } .fam-report .fhowto ul { margin:0; padding-left:16px; font-size:8.8pt; } .fam-report .fhowto li { margin-bottom:3px; }

const stdev = a => { if(a.length<2) return null; const m=mean(a); return Math.sqrt(a.reduce((acc,x)=>acc+(x-m)**2,0)/a.length); }; // populacional
const mode = a => {
  if(!a.length) return '—';
  const c = {}; a.forEach(x => { const k = x.toFixed(1); c[k]=(c[k]||0)+1; });
  const mx = Math.max(...Object.values(c));
  if (mx===1) return 'sem moda';
  const ms = Object.keys(c).filter(k=>c[k]===mx).sort((x,y)=>x-y);
  return ms.length>3 ? 'multimodal' : ms.map(m=>(+m).toLocaleString('pt-BR',{minimumFractionDigits:1})).join(' · ');
};

const state = { tab:'visao', unit:'Ambas', serie:'1ª série', tri:3, disc:'Todas', aluno:'', week:'', report:{} };
function unitsSel() { return state.unit==='Ambas' ? UNITS : [state.unit]; }
/* ============================================================ IDENTIDADE DOS ALUNOS
   Cada aluno tem uma CHAVE única no painel (key): "a:<id ActiveSoft>:<turma>" quando existe no
   ActiveSoft, ou "g:<member_id Geekie>:<turma>" quando só existe no Geekie. Todo filtro, clique e
   agendamento usa essa chave — nunca o nome. O pareamento ActiveSoft × Geekie é feito SOMENTE
   dentro da mesma turma, 1 para 1, em níveis de confiança:
     1) nome idêntico (ignorando acentos/maiúsculas);
     2) o nome mais curto está inteiro contido no mais longo (ex.: "Bia Azevedo Feitosa" ⊂ "Beatriz
        Azevedo Feitosa"; "Ana Rodrigues" ⊂ "Ana Luiza Penha Rodrigues"), tolerando 1 letra de
        diferença por sobrenome (Ieno/Leno, Priscila/Priscilla) — aceito só quando é o ÚNICO candidato;
     3) o que sobra fica SEM PAR e aparece na aba "Cadastro" para conferência manual.
   Assim, irmãos (Kevin × Eric × Nicole Asfury) e homônimas parciais (Ana Clara Torres × Ana Clara
   Melo) nunca se misturam: estão em turmas diferentes e nenhum nome contém o outro. */
const normName = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const STOP_TOKENS = new Set(['de','da','do','das','dos','e','d']);
const NICKNAMES = {bia:'beatriz', bea:'beatriz'};
const nameTokens = s => normName(s).replace(/[^a-z0-9 ]+/g,' ').split(' ').filter(t=>t && !STOP_TOKENS.has(t)).map(t=>NICKNAMES[t]||t);
function levenshtein(a, b) {
  if (a===b) return 0; const m=a.length, n=b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1}, (_,i)=>i), cur;
  for (let i=1;i<=m;i++) { cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
/* dois sobrenomes/nomes são "iguais" se idênticos ou se diferem em 1 letra (2 letras a partir de 8) */
const tokEq = (x, y) => x===y || (x.length>=4 && y.length>=4 && levenshtein(x,y) <= (Math.min(x.length,y.length)>=8 ? 2 : 1));
/* grau de casamento entre dois nomes: 'exact' | 'subset' | null (primeiro nome precisa bater) */
function matchGrade(a, b) {
  if (normName(a)===normName(b)) return 'exact';
  const ta = nameTokens(a), tb = nameTokens(b);
  if (!ta.length || !tb.length || !tokEq(ta[0], tb[0])) return null;
  const [sh, lg] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
  const used = new Set(); let common = 0;
  sh.forEach(t => { const j = lg.findIndex((u,i)=>!used.has(i) && tokEq(t,u)); if (j>=0) { used.add(j); common++; } });
  return common === sh.length ? 'subset' : null;
}
/* pareia listas (mesma turma) 1:1. Aceita um par só quando ele é a única opção do aluno Geekie e os
   outros alunos Geekie que apontam para o mesmo registro ActiveSoft ainda têm alternativas. */
function linkStudents(asfList, gkList) {
  const links = {}, report = {linked:[], ambiguous:[], gkOnly:[], asfOnly:[]};
  const byT = {};
  asfList.forEach(a => (byT[a.turma] = byT[a.turma] || {a:[],g:[]}).a.push(a));
  gkList.forEach(g => (byT[g.turma] = byT[g.turma] || {a:[],g:[]}).g.push(g));
  for (const [turma, {a, g}] of Object.entries(byT)) {
    let A = [...a], G = [...g];
    for (const level of ['exact','subset']) {
      let changed = true;
      while (changed) {
        changed = false;
        const cand = {}, rev = {};
        G.forEach(gg => A.forEach(aa => { const mg = matchGrade(gg.nome, aa.nome); if (mg && (mg==='exact' || level==='subset')) { (cand[gg.m]=cand[gg.m]||[]).push(aa); (rev[aa.aid]=rev[aa.aid]||[]).push(gg); } }));
        for (const gg of [...G]) {
          const c = cand[gg.m] || [];
          if (c.length!==1) continue;
          const others = (rev[c[0].aid]||[]).filter(x=>x!==gg);
          if (others.some(o => (cand[o.m]||[]).length===1)) continue;   // disputa real → deixa para conferência
          const grade = matchGrade(gg.nome, c[0].nome);
          links[gg.m+'|'+turma] = {aid:c[0].aid, grade};
          report.linked.push({turma, m:gg.m, aid:c[0].aid, gk:gg.nome, asf:c[0].nome, grade});
          G = G.filter(x=>x!==gg); A = A.filter(x=>x!==c[0]); changed = true;
        }
      }
    }
    G.forEach(gg => { const c = A.filter(aa=>matchGrade(gg.nome, aa.nome)); if (c.length) report.ambiguous.push({turma, m:gg.m, gk:gg.nome, candidatos:c.map(x=>x.nome)}); else report.gkOnly.push({turma, m:gg.m, gk:gg.nome}); });
    A.forEach(aa => report.asfOnly.push({turma, aid:aa.aid, asf:aa.nome}));
  }
  return {links, report};
}
let STUDENTS = [], BY_KEY = {}, KEY_OF_GK = {}, KEY_OF_ASF = {}, ALUNOS_POR_TURMA = {}, CADASTRO = null;

    gkList.push({m:s.m, turma:a.turma, unit:a.unit, serie:a.serie, nome:s.nome}); }));

      STUDENTS.push(st); BY_KEY[key] = st; KEY_OF_GK[g.m+'|'+g.turma] = key;

  const byAid = {}; STUDENTS.forEach(s => { if (s.aid!=null) (byAid[s.aid]=byAid[s.aid]||[]).push(s.turma); });
  STUDENTS.forEach(s => { s.turmas = s.aid!=null ? byAid[s.aid] : [s.turma]; });
  ALUNOS_POR_TURMA = {};
  STUDENTS.forEach(s => (ALUNOS_POR_TURMA[s.turma] = ALUNOS_POR_TURMA[s.turma] || []).push(s));
  for (const t of Object.keys(ALUNOS_POR_TURMA)) ALUNOS_POR_TURMA[t].sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
  CADASTRO = report;
  /* propaga chave e nome oficial (ActiveSoft) para as atividades do Geekie */
  DATA.gk_acts.forEach(a => a.students.forEach(s => { const st = BY_KEY[KEY_OF_GK[s.m+'|'+a.turma]]; s.key = st ? st.key : 'g:'+s.m+':'+a.turma; if (st) s.nome = st.nome; }));
}

/* ---------- SVG: barras horizontais agrupadas ---------- */
function groupedBarChart(items, opts={}) {
  const max = opts.max ?? Math.max(1e-9, ...items.flatMap(i=>[i.a?.v||0, i.b?.v||0]));
  const rowH = 40, barH = 13, labelW = opts.labelW ?? 180, W = opts.width ?? 860, chartW = W-labelW-60;
  const H = items.length*rowH + 26;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" style="width:100%;max-width:${W}px">`;
  const ticks = opts.ticks ?? 5;
  for (let t=0; t<=ticks; t++) {
    const x = labelW + chartW*t/ticks;
    s += `<line class="gridline" x1="${x}" y1="6" x2="${x}" y2="${H-20}"></line>`;
    s += `<text x="${x}" y="${H-6}" text-anchor="middle">${opts.tickFmt ? opts.tickFmt(max*t/ticks) : fmt(max*t/ticks,1)}</text>`;
  }
  items.forEach((it,i) => {
    const y = i*rowH+10;
    s += `<text x="${labelW-8}" y="${y+barH+3}" text-anchor="end" style="font-size:11.5px">${it.label}</text>`;
    [['a','Bessa'],['b','Sul']].forEach(([k,u],j) => {
      const d = it[k]; if (!d || d.v==null) return;
      const w = Math.max(2, chartW*d.v/max), y2 = y + j*(barH+3);
      s += `<rect x="${labelW}" y="${y2}" width="${w}" height="${barH}" rx="4" fill="${d.color||UCOLOR[u]}" data-tip="${d.tip||''}"></rect>`;
      s += `<text class="val" x="${labelW+w+5}" y="${y2+barH-3}" style="font-size:10.5px">${opts.valFmt ? opts.valFmt(d.v) : fmt(d.v,1)}</text>`;
    });
  });
  s += '</svg>';
  return s;
}

function isDarkMode(){ return document.documentElement.dataset.theme==='dark' || (matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light'); }
function heat(v01) {
  if (v01==null || isNaN(v01)) return 'transparent';
  const v = Math.max(0, Math.min(1, v01));
  const L = isDarkMode() ? (18 + 38*v) : (97 - 42*v);
  const C = 4 + 46*v;
  return `oklch(${L}% ${C/100*0.34} 340)`;
}
function heatInk(v01) {
  if (v01==null || isNaN(v01)) return 'var(--ink-3)';
  if (isDarkMode()) return v01>0.45 ? '#fff' : 'var(--ink)';
  return v01>0.55 ? '#fff' : 'var(--ink)';
}

/* resumo de presença por aluno × disciplina, respeitando série/unidade/trimestre e a data de extração */
function freqSummary(opts={}) {
  const out = {}; // aid -> {nome, unit, serie, turma, byDisc:{disc:{p,f,j,d,inf,datasF:[]}}, tot:{...}}
  const today = DATA.extraido_em;
  DATA.freq.forEach(fr => {
    if (!unitsSel().includes(fr.unit) || !serieMatch(fr.serie) || !triMatch(fr.tri)) return;
    if (opts.disc && opts.disc!=='Todas' && fr.disc!==opts.disc) return;
    for (const [aid, st] of Object.entries(fr.al)) {
      const al = DATA.asf_alunos[aid]; if (!al) continue;
      if (opts.aid && String(opts.aid)!==String(aid)) continue;
      if (opts.turma && fr.turma!==opts.turma) continue;
      const e = out[aid] = out[aid] || {aid, nome:al.nome, unit:fr.unit, serie:fr.serie, turma:fr.turma, byDisc:{}, tot:{p:0,f:0,j:0,d:0,inf:0,datasF:[]}};
      const d = e.byDisc[fr.disc] = e.byDisc[fr.disc] || {p:0,f:0,j:0,d:0,inf:0,datasF:[]};
      for (let i=0;i<st.length;i++) {
        const c = st[i], dt = fr.aulas[i];
        if (dt && dt > today) continue;             // aula futura (criada mas não dada)
        if (c==='P') { d.p++; d.inf++; e.tot.p++; e.tot.inf++; }
        else if (c==='F') { d.f++; d.inf++; e.tot.f++; e.tot.inf++; d.datasF.push(dt); e.tot.datasF.push(dt); }
        else if (c==='J') { d.j++; d.inf++; e.tot.j++; e.tot.inf++; d.datasF.push(dt+' (justificada)'); e.tot.datasF.push(dt+' (justificada)'); }
        else if (c==='D') { d.d++; e.tot.d++; }
      }
    }
  });
  return out;
}

/* ============================================================ sinalizações (Busca Ativa) */
/* pendências acumuladas até a semana `uptoMonday` (inclusive), ignorando o que veio antes de `afterMonday` (exclusive) */
function studentFlags(uptoMonday, afterMondayByKey) {
  const acts = DATA.gk_acts.filter(a => unitsSel().includes(a.unit) && serieMatch(a.serie) && triMatch(a.tri) && isDue(a) && (!uptoMonday || a.monday <= uptoMonday));
  const perStudent = {};
  acts.forEach(a => a.students.forEach(s => {
    const e = perStudent[s.key] = perStudent[s.key] || {key:s.key, m:s.m, nome:s.nome, unit:a.unit, serie:a.serie, turma:a.turma, byWeek:{}, byDisc:{}, total:0, missed:0, resp:0, ok:0, byDiscPerf:{}};
    const after = afterMondayByKey ? afterMondayByKey(s.key) : null;
    if (after && a.monday <= after) return;      // já coberto por um atendimento agendado
    e.total++; if (!s.fez) e.missed++;
    (e.byWeek[a.monday] = e.byWeek[a.monday] || []).push({a, fez:s.fez});
    (e.byDisc[a.disc] = e.byDisc[a.disc] || []).push({end:a.end, fez:s.fez, title:a.title});
    if (s.resp>0) { const d = e.byDiscPerf[a.disc] = e.byDiscPerf[a.disc] || {resp:0, ok:0, n:0}; d.resp+=s.resp; d.ok+=s.acertos; d.n++; e.resp+=s.resp; e.ok+=s.acertos; }
  }));
  const flags = [];
  for (const e of Object.values(perStudent)) {
    const reasons = [];
    for (const [wk, list] of Object.entries(e.byWeek).sort()) {
      const missed = list.filter(x=>!x.fez);
      if (missed.length>=3) reasons.push({t:'eng', txt:`${missed.length} atividades não feitas na semana de ${brDate(wk)} (${[...new Set(missed.map(x=>x.a.disc))].join(', ')})`});
    }
    for (const [disc, list] of Object.entries(e.byDisc)) {
      list.sort((x,y)=>x.end.localeCompare(y.end));
      let run=0, best=0;
      list.forEach(x => { run = x.fez ? 0 : run+1; best = Math.max(best,run); });
      if (best>=2) reasons.push({t:'eng', txt:`${best} atividades seguidas de ${disc} sem fazer`});
    }
    const lowDiscs = [];
    for (const [disc,d] of Object.entries(e.byDiscPerf)) if (d.resp>=5 && d.ok/d.resp <= 0.5) lowDiscs.push(`${disc} (${Math.round(100*d.ok/d.resp)}% em ${d.n} ativ.)`);
    if (lowDiscs.length) reasons.push({t:'perf', txt:'Rendimento ≤ 50% em: '+lowDiscs.join('; ')});
    const overall = e.resp>0 ? e.ok/e.resp : null;
    if (!lowDiscs.length && overall!=null && overall<=0.5 && e.resp>=10) reasons.push({t:'perf', txt:`Rendimento geral de ${Math.round(overall*100)}% nas questões respondidas`});
    flags.push({key:e.key, m:e.m, nome:e.nome, unit:e.unit, serie:e.serie, turma:e.turma, reasons, missed:e.missed, total:e.total, overall,
      score: reasons.filter(r=>r.t==='eng').length*2 + reasons.filter(r=>r.t==='perf').length + (e.total? e.missed/e.total : 0)});
  }
  return flags;
}

/* ---------- agendamentos (Supabase: habilis_busca_ativa) ---------- */
let AGENDA = [];           // linhas da tabela
const HASHES = {};         // key do aluno -> [hash...] (o 1º é o usado ao gravar)
async function sha256Hex(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* nomes pelos quais o aluno pode ter sido gravado: o do Geekie (usado desde o início) e o do ActiveSoft */
function hashNames(st) {
  const names = [];
  if (st.gkNome) names.push(st.gkNome);
  if (st.asfNome && (!st.gkNome || normName(st.asfNome)!==normName(st.gkNome))) names.push(st.asfNome);
  return names;
}
async function hashesOf(st) {
  if (!HASHES[st.key]) HASHES[st.key] = await Promise.all(hashNames(st).map(n => sha256Hex('habilis:'+normName(n)+'|'+st.turma)));
  return HASHES[st.key];
}
async function buildHashes() {
  if (!window.crypto || !crypto.subtle) return;
  await Promise.all(STUDENTS.map(hashesOf));
}
async function loadAgenda() {
  try {
    const r = await fetch(SB_URL+'/rest/v1/habilis_busca_ativa?select=id,aluno_hash,turma,semana_ref,agendado_para,agendado_em,status,obs_enc&order=agendado_em.desc', {headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY}});
    if (r.ok) AGENDA = await r.json();
  } catch(e) { AGENDA = []; }
}
async function encObs(txt) {
  if (!txt) return null;
  if (!window.openpgp || !PW) return null;
  const msg = await openpgp.createMessage({text: txt});
  const enc = await openpgp.encrypt({message: msg, passwords:[PW], format:'binary'});
  return btoa(String.fromCharCode(...enc));
}
const OBS_CACHE = {};
async function decObs(b64) {
  if (!b64) return '';
  if (OBS_CACHE[b64]!=null) return OBS_CACHE[b64];
  try {
    const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    const msg = await openpgp.readMessage({binaryMessage: bin});
    const dec = await openpgp.decrypt({message: msg, passwords:[PW], format:'utf8'});
    return OBS_CACHE[b64] = dec.data;
  } catch(e) { return OBS_CACHE[b64] = '(não foi possível abrir a observação)'; }
}
/* agendamento ativo (mais recente, não cancelado) de um aluno */
function agendaOf(st) {
  if (!st) return null;
  const hs = HASHES[st.key] || [];
  if (!hs.length) return null;
  return AGENDA.filter(a => hs.includes(a.aluno_hash) && a.status!=='cancelado').sort((a,b)=>b.agendado_em.localeCompare(a.agendado_em))[0] || null;
}
async function saveAgenda(row) {
  const r = await fetch(SB_URL+'/rest/v1/habilis_busca_ativa', {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json', Prefer:'return=representation'}, body: JSON.stringify(row)});
  if (!r.ok) throw new Error('HTTP '+r.status);
  const [saved] = await r.json();
  AGENDA.unshift(saved);
}
async function updateAgenda(id, patch) {
  const r = await fetch(SB_URL+`/rest/v1/habilis_busca_ativa?id=eq.${id}`, {method:'PATCH', headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json', Prefer:'return=minimal'}, body: JSON.stringify({...patch, updated_at:new Date().toISOString()})});
  if (!r.ok) throw new Error('HTTP '+r.status);
  const a = AGENDA.find(x=>x.id===id); if (a) Object.assign(a, patch);
}

    tr.innerHTML = h; tb.appendChild(tr);

      if (mine.length) it.a = {v:mean(mine), color:'var(--brand-teal)', tip:`<b>${d} — ${esc(sel.nome)}</b>${fmt(mean(mine))}`};
      if (turma.length) it.b = {v:mean(turma), color:'var(--ink-3)', tip:`<b>${d} — média da turma</b>${fmt(mean(turma))} (${turma.length} notas)`};

  if (state.serie==='Todas') { root.appendChild(el('div',{class:'notice'}, 'Selecione uma <b>série</b> no filtro para ver notas e estatísticas — ou um <b>aluno</b> para abrir o boletim dele.')); return; }
  const rows = DATA.asf_rows.filter(r => r.serie===state.serie && triMatch(r.tri) && (state.disc==='Todas'||r.disc===state.disc));
  /* estatísticas por métrica */

  });

  if (state.disc==='Todas') {
    const metricSel = state.notasMetric || 'media';
    UNITS.filter(u=>unitsSel().includes(u)).forEach(u => {
      const urows = rows.filter(r=>r.unit===u);
      if (!urows.length) return;
      const discs = [...new Set(urows.map(r=>r.disc))].sort((a,b)=>a.localeCompare(b,'pt'));
      const panel = el('div',{class:'panel'});
      const h3 = el('h3',{}, `Boletim da turma — ${state.serie} ${u} · ${NICE[metricSel]} `);
      const ms = el('select',{class:'inline'}); ms.innerHTML = Object.entries(NICE).map(([k,v])=>`<option value="${k}"${k===metricSel?' selected':''}>${v}</option>`).join('');
      ms.onchange = e => { state.notasMetric = e.target.value; render(); }; h3.appendChild(ms);
      panel.appendChild(h3);
      panel.appendChild(el('p',{class:'hint'}, state.tri===0 ? 'Com o filtro "Ano", cada célula é a média dos trimestres com nota.' : 'Clique no nome do aluno para abrir o boletim completo.'));
      const tbl = el('table',{class:'grid'});
      let head = '<thead><tr><th>Aluno</th>';
      discs.forEach(d => head += `<th class="hm" data-tip="${esc(d)}">${d.length>12? esc(d.slice(0,11))+'…':esc(d)}</th>`);
      head += '<th>Média</th></tr></thead>';
      tbl.innerHTML = head;
      const tb = el('tbody');
      const alunos = {}, u_turma = {}; urows.forEach(r => { alunos[r.aid] = r.aluno; u_turma[r.aid] = r.turma; });
      Object.entries(alunos).sort((a,b)=>a[1].localeCompare(b[1],'pt')).forEach(([aid, nome]) => {
        const tr = el('tr');
        let h = `<td>${studentLink(KEY_OF_ASF[aid+'|'+u_turma[aid]]||'', nome)}</td>`;
        const vals = [];
        discs.forEach(d => {
          const vs = urows.filter(r=>String(r.aid)===aid && r.disc===d && r[metricSel]!=null).map(r=>r[metricSel]);
          if (!vs.length) { h += '<td class="hm muted">·</td>'; return; }
          const v = mean(vs); vals.push(v);
          h += `<td class="hm" style="background:${heat(1-v/10)};color:${heatInk(1-v/10)}" data-tip="<b>${esc(nome)} — ${esc(d)}</b>${NICE[metricSel]}: ${fmt(v)}">${fmt(v)}</td>`;
        });
        h += vals.length ? `<td class="${mean(vals)<7?'bad':''}"><b>${fmt(mean(vals))}</b></td>` : '<td class="muted">—</td>';
        tr.innerHTML = h; tb.appendChild(tr);
      });
      const tf = el('tr',{class:'foot'});
      let fh = '<td>Média da turma</td>';
      discs.forEach(d => { const vs = urows.filter(r=>r.disc===d && r[metricSel]!=null).map(r=>r[metricSel]); fh += `<td class="hm">${vs.length?fmt(mean(vs)):'—'}</td>`; });
      const allv = urows.filter(r=>r[metricSel]!=null).map(r=>r[metricSel]); fh += `<td>${allv.length?fmt(mean(allv)):'—'}</td>`;
      tf.innerHTML = fh; tb.appendChild(tf);
      tbl.appendChild(tb); panel.appendChild(tbl); root.appendChild(panel);
    });
    return;
  }
  /* disciplina específica: tabela aluno a aluno */
  UNITS.filter(u=>unitsSel().includes(u)).forEach(u => {
    const urows = rows.filter(r=>r.unit===u);
    if (!urows.length) return;
    const multiTurma = new Set(urows.map(r=>r.turma)).size > 1;
    const panel = el('div',{class:'panel'});
    panel.appendChild(el('h3',{}, `${state.disc} — ${state.serie} ${u}`));
    const tbl = el('table',{class:'grid'});
    let head = `<thead><tr><th>Aluno</th>${multiTurma?'<th>Turma</th>':''}`;
    tris.forEach(t => head += `<th>AE1 (${t}º)</th><th>AE2 (${t}º)</th><th>AQ (${t}º)</th><th>Fase (${t}º)</th><th>Rec. (${t}º)</th><th>Pós-rec. (${t}º)</th><th>Faltas (${t}º)</th>`);
    head += '</tr></thead>';
    tbl.innerHTML = head;
    const tb = el('tbody');
    const alunos = {}; urows.forEach(r => { alunos[r.aid] = r; });
    Object.values(alunos).sort((a,b)=>a.aluno.localeCompare(b.aluno,'pt')).forEach(t0 => {
      const tr = el('tr');
      let h = `<td>${studentLink(keyOfRow(t0), t0.aluno)}</td>${multiTurma?`<td>${t0.turma}</td>`:''}`;
      tris.forEach(t => {
        const r = urows.find(x=>x.aid===t0.aid && x.tri===t) || {};
        h += gradeCell(r.ae1)+gradeCell(r.ae2)+gradeCell(r.aq)+gradeCell(r.media)+recCell(r)+finalCell(r)+`<td>${r.faltas??'—'}</td>`;
      });
      tr.innerHTML = h; tb.appendChild(tr);
    });
    tbl.appendChild(tb); panel.appendChild(tbl); root.appendChild(panel);
  });
}
/* ---------- DESEMPENHO GEEKIE ---------- */
/* resumo por disciplina de um aluno (nome) nas atividades filtradas */
function gkStudentSummary(key, acts) {
  const byDisc = {};
  acts.forEach(a => a.students.forEach(s => {
    if (s.key!==key) return;
    const d = byDisc[a.disc] = byDisc[a.disc] || {disc:a.disc, total:0, fez:0, resp:0, ok:0, acts:[]};
    const due = isDue(a);
    if (due) { d.total++; if (s.fez) d.fez++; }
    d.resp += s.resp; d.ok += s.acertos;
    d.acts.push({a, s});
  }));
  return Object.values(byDisc).sort((a,b)=>a.disc.localeCompare(b.disc,'pt'));
}

                       : miss>0 ? `background:${heat(Math.min(miss/3,0.6))};color:${heatInk(Math.min(miss/3,0.6))}` : 'color:var(--ok)';
          const tipTxt = miss ? `<b>${esc(e.nome)} — semana de ${brDate(wk)}</b>Não fez: ${w.m.map(x=>`${esc(x.disc)} (${esc(x.title.slice(0,40))})`).join('; ')}` : `<b>${esc(e.nome)}</b>Semana de ${brDate(wk)}: tudo em dia (${w.t} atividades)`;
          h += `<td class="hm" style="${style}" data-tip="${tipTxt}">${miss}/${w.t}</td>`;
        });
        h += `<td style="font-weight:700">${e.missed}/${e.total}</td>`;
        tr.innerHTML = h; tb.appendChild(tr);
      });
    tbl.appendChild(tb); panel.appendChild(tbl); root.appendChild(panel);
  });
}

/* ---------- BUSCA ATIVA ---------- */
function tabBusca(root) {
  root.appendChild(el('h2',{}, `Busca Ativa · ${serieLabel()} · ${triLabel()}`));
  root.appendChild(el('p',{class:'hint'}, 'Fila de alunos a acompanhar, com pendências <b>acumuladas</b> do início do período até a semana escolhida. Critérios: 3+ atividades não feitas na mesma semana, 2 seguidas da mesma disciplina, ou rendimento ≤ 50%. Ao <b>agendar atendimento</b>, as pendências até aquela semana são zeradas e o aluno vai para o fim da fila — só volta se acumular novas.'));
  const dueActs = DATA.gk_acts.filter(a => unitsSel().includes(a.unit) && serieMatch(a.serie) && triMatch(a.tri) && isDue(a));
  const weeks = weeksOf(dueActs);
  if (!weeks.length) { root.appendChild(el('div',{class:'notice'}, 'Sem atividades com prazo encerrado no período selecionado.')); return; }
  if (!state.week || !weeks.includes(state.week)) state.week = weeks[weeks.length-1];
  const tbar = el('div',{class:'toolbar'});
  const wsel = el('select',{class:'inline'});
  wsel.innerHTML = weeks.map(w => { const end = new Date(w+'T12:00:00'); end.setDate(end.getDate()+6); return `<option value="${w}"${w===state.week?' selected':''}>Semana de ${brDate(w)} a ${brDate(end.toISOString().slice(0,10))}</option>`; }).join('');
  wsel.onchange = e => { state.week = e.target.value; render(); };
  tbar.append(el('label',{}, 'Até a semana: '), wsel);
  const prevBtn = el('button',{class:'ghost'}, '← anterior'), nextBtn = el('button',{class:'ghost'}, 'próxima →');
  prevBtn.onclick = () => { const i = weeks.indexOf(state.week); if (i>0) { state.week = weeks[i-1]; render(); } };
  nextBtn.onclick = () => { const i = weeks.indexOf(state.week); if (i<weeks.length-1) { state.week = weeks[i+1]; render(); } };
  tbar.append(prevBtn, nextBtn);
  root.appendChild(tbar);

  /* semana de referência do agendamento ativo de cada aluno */
  const afterOf = key => { const ag = agendaOf(BY_KEY[key]); return ag && ag.semana_ref ? ag.semana_ref : null; };
  const flagsAll = studentFlags(state.week, afterOf).filter(f => matchAluno(f.key));
  const fs = freqSummary({});
  const faltasOf = st => { if (!st || st.aid==null) return null; const e = Object.values(fs).find(x => String(x.aid)===String(st.aid) && x.turma===st.turma) || fs[st.aid]; return e ? e.tot : null; };
  const ocOf = st => (!st || st.aid==null) ? 0 : ocorrFiltered({aid: st.aid}).length;

  const fila = flagsAll.filter(f => f.reasons.length).sort((a,b)=> b.score - a.score || a.nome.localeCompare(b.nome,'pt'));
  const agendados = flagsAll.filter(f => !f.reasons.length && agendaOf(BY_KEY[f.key])).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));

  const card = (f, sched) => {
    const it = el('div',{class:'item flagcard'+(sched?' sched':'')});
    const st = BY_KEY[f.key];
    const ag = agendaOf(st);
    const fal = faltasOf(st); const nOc = ocOf(st);
    const ctx = [];
    if (fal && fal.inf) ctx.push(`<span class="badge ${faltaPct(fal)>=0.25?'bad':faltaPct(fal)>=0.1?'warn':'neutral'}" data-tip="Faltas no período (ActiveSoft)">${fal.f+fal.j} faltas · ${pct(faltaPct(fal))}</span>`);
    if (nOc) ctx.push(`<span class="badge warn" data-tip="Ocorrências disciplinares no período">${nOc} ocorrência${nOc>1?'s':''}</span>`);
    ctx.push(`<span class="badge neutral">${f.missed}/${f.total} não feitas</span>`);
    let agHtml = '';
    if (ag) agHtml = `<div style="margin-top:6px;font-size:.8rem;color:var(--brand-teal)"><b style="display:inline">📅 Atendimento ${ag.status==='realizado'?'realizado':'agendado'}${ag.agendado_para?' para '+brDateFull(ag.agendado_para):''}</b> · zera pendências até ${ag.semana_ref?brDate(ag.semana_ref):'—'} <span class="obs muted" data-obs="${esc(ag.obs_enc||'')}"></span></div>`;
    it.innerHTML = `<b>${studentLink(f.key, f.nome)} <span class="muted">· ${esc(f.turma)}</span></b>
      <div class="why">${f.reasons.length ? f.reasons.slice(0,4).map(r=>'• '+esc(r.txt)).join('<br>') : '<span class="muted">Sem novas pendências desde o atendimento.</span>'}${f.reasons.length>4?`<br><span class="muted">+ ${f.reasons.length-4} sinais</span>`:''}</div>
      <div class="actions">${ctx.join(' ')}</div>${agHtml}<div class="actions"></div>`;
    const act = it.querySelectorAll('.actions')[1];
    const b1 = el('button',{class:'primary teal'}, ag && ag.status==='agendado' ? 'Reagendar' : 'Agendar atendimento');
    b1.onclick = () => openScheduleModal(f, state.week);
    act.appendChild(b1);
    if (ag && ag.status==='agendado') {
      const b2 = el('button',{class:'ghost'}, 'Marcar realizado'); b2.onclick = async () => { try { await updateAgenda(ag.id, {status:'realizado'}); render(); } catch(e) { alert('Não foi possível atualizar: '+e); } };
      const b3 = el('button',{class:'ghost'}, 'Cancelar'); b3.onclick = async () => { try { await updateAgenda(ag.id, {status:'cancelado'}); render(); } catch(e) { alert('Não foi possível atualizar: '+e); } };
      act.append(b2, b3);
    }
    if (ag && ag.obs_enc && window.openpgp) decObs(ag.obs_enc).then(t => { const o = it.querySelector('.obs'); if (o && t) o.textContent = ' · "'+t+'"'; });
    return it;
  };

  root.appendChild(el('h3',{}, `🔻 Fila de busca ativa <span class="badge bad">${fila.length} alunos</span>`));
  const la = el('div',{class:'flaglist'});
  fila.forEach(f => la.appendChild(card(f, false)));
  if (!fila.length) la.appendChild(el('div',{class:'item'}, '<span class="badge ok">Nenhum aluno sinalizado até esta semana</span>'));
  root.appendChild(la);
  if (agendados.length) {
    root.appendChild(el('h3',{}, `📅 Atendidos / agendados sem novas pendências <span class="badge neutral">${agendados.length}</span>`));
    const lb = el('div',{class:'flaglist'});
    agendados.forEach(f => lb.appendChild(card(f, true)));
    root.appendChild(lb);
  }
  /* histórico de agendamentos no filtro */
  const hist = AGENDA.filter(a => Object.keys(ALUNOS_POR_TURMA).some(t => unitsSel().some(u=>t.endsWith(' '+u)) && (state.serie==='Todas' || DATA.asf_rows.some(r=>r.turma===t && r.serie===state.serie)) && t===a.turma));
  if (hist.length) {
    const p = el('div',{class:'panel'});
    p.appendChild(el('h3',{}, `Histórico de atendimentos <span class="muted">(${hist.length})</span>`));
    const tbl = el('table',{class:'grid'}); tbl.innerHTML = '<thead><tr><th>Aluno</th><th>Turma</th><th>Semana ref.</th><th>Atendimento</th><th>Registrado em</th><th>Situação</th><th>Observação</th></tr></thead>';
    const tb = el('tbody');
    const nameOfHash = h => { const st = STUDENTS.find(s => (HASHES[s.key]||[]).includes(h)); return st ? st.nome : '(aluno não identificado)'; };
    hist.forEach(a => { const tr = el('tr'); tr.innerHTML = `<td>${esc(nameOfHash(a.aluno_hash))}</td><td>${esc(a.turma||'')}</td><td>${brDate(a.semana_ref)}</td><td>${brDateFull(a.agendado_para)}</td><td>${brDateFull((a.agendado_em||'').slice(0,10))}</td><td><span class="badge ${a.status==='realizado'?'ok':a.status==='cancelado'?'neutral':'warn'}">${a.status}</span></td><td class="wrap obs" data-obs="${esc(a.obs_enc||'')}"></td>`; tb.appendChild(tr);
      if (a.obs_enc && window.openpgp) decObs(a.obs_enc).then(t => { tr.querySelector('.obs').textContent = t; }); });
    tbl.appendChild(tb); p.appendChild(tbl); root.appendChild(p);
  }
}

/* ---------- AQ ---------- */
function tabAQ(root) {
  root.appendChild(el('h2',{}, `AQ calculada — engajamento por disciplina · ${serieLabel()}`));
  root.appendChild(el('p',{class:'hint'}, 'AQ = % de atividades feitas na disciplina no trimestre × 10 (só prazos encerrados). Compare com a AQ lançada no ActiveSoft na aba Notas.'));
  if (state.serie==='Todas') { root.appendChild(el('div',{class:'notice'}, 'Selecione uma <b>série</b> no filtro.')); return; }
  const tri = state.tri===0 ? 3 : state.tri;
  if (state.tri===0) root.appendChild(el('div',{class:'notice'}, 'Com o filtro "Ano", a AQ mostrada é a do <b>3º trimestre</b>.'));
  UNITS.filter(u=>unitsSel().includes(u)).forEach(u => {
    const acts = DATA.gk_acts.filter(a=>a.unit===u && a.serie===state.serie && a.tri===tri && isDue(a) && (state.disc==='Todas'||a.disc===state.disc));
    if (!acts.length) return;
    const discs = [...new Set(acts.map(a=>a.disc))].sort((a,b)=>a.localeCompare(b,'pt'));
    const panel = el('div',{class:'panel'});
    panel.appendChild(el('h3',{}, `${state.serie} ${u} — ${tri}º trimestre`));
    const tbl = el('table',{class:'grid'});
    let head = '<thead><tr><th>Aluno</th>';
    discs.forEach(d => head += `<th class="hm" data-tip="${esc(d)}">${d.length>14? esc(d.slice(0,13))+'…':esc(d)}</th>`);
    head += '<th>AQ média</th></tr></thead>';
    tbl.innerHTML = head;
    const tb = el('tbody');
    const studs = {};
    acts.forEach(a => a.students.forEach(s => {
      const e = studs[s.m] = studs[s.m] || {key:s.key, nome:s.nome, byDisc:{}};
      const d = e.byDisc[a.disc] = e.byDisc[a.disc] || {t:0,f:0};
      d.t++; if (s.fez) d.f++;
    }));
    Object.entries(studs).sort((a,b)=>a[1].nome.localeCompare(b[1].nome,'pt'))
      .filter(([m,e]) => matchAluno(e.key))
      .forEach(([m,e]) => {
        const tr = el('tr');
        let h = `<td>${esc(e.nome)}</td>`;
        const aqs = [];
        discs.forEach(d => {
          const x = e.byDisc[d];
          if (!x) { h += '<td class="hm muted">·</td>'; return; }
          const aq = 10*x.f/x.t; aqs.push(aq);
          h += `<td class="hm" style="background:${heat(1-aq/10)};color:${heatInk(1-aq/10)}" data-tip="<b>${esc(e.nome)} — ${esc(d)}</b>fez ${x.f} de ${x.t} atividades → AQ ${fmt(aq)}">${fmt(aq)}</td>`;
        });
        h += `<td style="font-weight:700">${fmt(mean(aqs))}</td>`;
        tr.innerHTML = h; tb.appendChild(tr);
      });
    const tf = el('tr',{class:'foot'});
    let fh = '<td>Média da turma</td>';
    discs.forEach(d => { let T=0,F=0; acts.filter(a=>a.disc===d).forEach(a=>a.students.forEach(s=>{T++; if(s.fez)F++;})); fh += `<td class="hm">${T?fmt(10*F/T):'—'}</td>`; });
    let T=0,F=0; acts.forEach(a=>a.students.forEach(s=>{T++; if(s.fez)F++;}));
    fh += `<td>${T?fmt(10*F/T):'—'}</td>`;
    tf.innerHTML = fh; tb.appendChild(tf);
    tbl.appendChild(tb); panel.appendChild(tbl); root.appendChild(panel);
  });
}

/* ---------- PROFESSORES ---------- */
function tabProfessores(root) {
  root.appendChild(el('h2',{}, `Envios de atividades pelos professores · ${serieLabel()} · ${triLabel()}`));
  root.appendChild(el('p',{class:'hint'}, 'Quadro diário por data de criação no GeekieOne. Amarelo: Bessa · Magenta: Sul. Borda direita do chip: <span class="chip casa">teal = para casa</span> <span class="chip sala">magenta = em sala</span>. Passe o cursor para ver tipo e prazo de cada atividade. Abaixo, disciplinas sem envio nos últimos 14 dias.'));
  const acts = DATA.gk_acts.filter(a => unitsSel().includes(a.unit) && serieMatch(a.serie) && triMatch(a.tri) && (state.disc==='Todas'||a.disc===state.disc));
  const byDay = {};
  acts.forEach(a => { (byDay[a.created] = byDay[a.created] || []).push(a); });
  const days = Object.keys(byDay).sort().reverse().slice(0, 42);
  const grid = el('div',{class:'daygrid'});
  const todayIso = DATA.extraido_em;
  days.forEach(d => {
    const cell = el('div',{class:'daycell'+(d===todayIso?' today':'')});
    const dt = new Date(d+'T12:00:00');
    cell.appendChild(el('div',{class:'dt'}, dt.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'})));
    const seen = new Set();
    byDay[d].forEach(a => {
      const key = a.unit+'|'+(a.prof||'?')+'|'+a.disc+'|'+a.turma+'|'+typeClass(a.type);
      if (seen.has(key)) return; seen.add(key);
      const group = byDay[d].filter(x=>x.unit===a.unit&&x.prof===a.prof&&x.disc===a.disc&&x.turma===a.turma&&typeClass(x.type)===typeClass(a.type));
      const tipTxt = `<b>${esc(a.prof||'—')} — ${esc(a.disc)} (${a.serie} ${a.unit})</b>${group.map(x=>`${x.type==='homework'?'🏠 Para casa':'🏫 Em sala'} · ${esc(x.title.slice(0,50))}<br>&nbsp;&nbsp;prazo ${brDateFull(x.end)}${x.endTime?' às '+x.endTime:''} · ${x.tq} questões`).join('<br>')}`;
      const c = el('span',{class:'chip '+a.unit.toLowerCase()+' '+typeClass(a.type), 'data-tip':tipTxt}, `${a.type==='homework'?'🏠':'🏫'} ${(a.prof||'—').split(' ')[0]} · ${a.disc.length>12?a.disc.slice(0,11)+'…':a.disc}${state.serie==='Todas'?' · '+a.serie.replace(' série','ª').replace(' ano','º'):''}${group.length>1?' ×'+group.length:''}`);
      cell.appendChild(c);
    });
    grid.appendChild(cell);
  });
  root.appendChild(grid);

  const cutoff = new Date(new Date(todayIso).getTime() - 14*86400000).toISOString().slice(0,10);
  UNITS.filter(u=>unitsSel().includes(u)).forEach(u => {
    const scope = DATA.gk_acts.filter(a=>a.unit===u && serieMatch(a.serie));
    const allDiscs = [...new Set(scope.map(a=>a.serie+' · '+a.disc))];
    const recent = new Set(scope.filter(a=>a.created>=cutoff).map(a=>a.serie+' · '+a.disc));
    const missing = allDiscs.filter(d=>!recent.has(d)).sort();
    const panel = el('div',{class:'panel'});
    panel.appendChild(el('h3',{}, `Sem envio há 14+ dias — ${u}`));
    panel.innerHTML += missing.length
      ? missing.map(sd => { const [sr, d] = sd.split(' · '); const items = scope.filter(a=>a.serie===sr&&a.disc===d); const last = items.map(a=>a.created).sort().pop(); const prof = items[items.length-1]?.prof||'—'; return `<span class="chip ${u.toLowerCase()}" data-tip="<b>${esc(d)} — ${sr} ${u}</b>último envio em ${brDate(last)} · ${esc(prof)}">${esc(d)} (${sr}) <span class="muted">últ.: ${brDate(last)}</span></span>`; }).join(' ')
      : '<span class="badge ok">Todas as disciplinas enviaram atividades no período</span>';
    root.appendChild(panel);
  });
}
/* ---------- PRESENÇA ---------- */
function tabPresenca(root) {
  root.appendChild(el('h2',{}, `Presença — faltas por disciplina · ${serieLabel()} · ${triLabel()}`));
  root.appendChild(el('p',{class:'hint'}, 'Faltas registradas nos diários do ActiveSoft, sobre as aulas já dadas e com frequência informada (aulas futuras ou não lançadas não contam). Justificadas contam como falta, mas aparecem no tooltip. Vermelho: ≥ 25% de faltas · sombreado: ≥ 10%. Selecione um <b>aluno</b> para ver as datas.'));
  const sel = selectedAsfAluno();
  if (state.aluno) {
    if (!sel) { root.appendChild(el('div',{class:'notice'}, `Não encontrei <b>${esc(alunoNome())}</b> nos diários do ActiveSoft.`)); return; }
    const fs = freqSummary({aid: sel.aid, turma: sel.turma, disc: state.disc});
    const e = fs[sel.aid];
    if (!e) { root.appendChild(el('div',{class:'notice'}, 'Sem aulas com frequência lançada para este aluno no período.')); return; }
    const panel = el('div',{class:'panel'});
    panel.appendChild(el('h3',{}, `${esc(sel.nome)} <span class="muted">· ${esc(sel.turma)}</span> — ${e.tot.f+e.tot.j} faltas em ${e.tot.inf} aulas (${pct(faltaPct(e.tot))})`));
    const tbl = el('table',{class:'grid'});
    tbl.innerHTML = '<thead><tr><th>Disciplina</th><th>Aulas dadas</th><th>Presenças</th><th>Faltas</th><th>Justificadas</th><th>% faltas</th><th>Datas das faltas</th></tr></thead>';
    const tb = el('tbody');
    Object.entries(e.byDisc).sort((a,b)=>a[0].localeCompare(b[0],'pt')).forEach(([d,x]) => {
      const tr = el('tr'); const p = faltaPct(x);
      tr.innerHTML = `<td>${esc(d)}</td><td>${x.inf}</td><td>${x.p}</td><td>${x.f}</td><td>${x.j}</td><td style="${faltaColor(p)}">${pct(p)}</td><td class="wrap muted">${x.datasF.map(s=>s.replace(/^(\d{4})-(\d{2})-(\d{2})/, '$3/$2')).join(', ')||'—'}</td>`;
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); panel.appendChild(tbl); root.appendChild(panel);
    return;
  }
  if (state.serie==='Todas') { root.appendChild(el('div',{class:'notice'}, 'Selecione uma <b>série</b> no filtro (ou um aluno).')); return; }
  const fs = freqSummary({disc: state.disc});
  UNITS.filter(u=>unitsSel().includes(u)).forEach(u => {
    const studs = Object.values(fs).filter(e => e.unit===u && e.serie===state.serie);
    if (!studs.length) return;
    const discs = [...new Set(studs.flatMap(e=>Object.keys(e.byDisc)))].sort((a,b)=>a.localeCompare(b,'pt'));
    const panel = el('div',{class:'panel'});
    panel.appendChild(el('h3',{}, `${state.serie} ${u}`));
    const tbl = el('table',{class:'grid'});
    let head = '<thead><tr><th>Aluno</th>';
    discs.forEach(d => head += `<th class="hm" data-tip="${esc(d)}">${d.length>12? esc(d.slice(0,11))+'…':esc(d)}</th>`);
    head += '<th>Faltas</th><th>Aulas</th><th>% faltas</th></tr></thead>';
    tbl.innerHTML = head;
    const tb = el('tbody');
    studs.sort((a,b)=>(faltaPct(b.tot)||0)-(faltaPct(a.tot)||0) || a.nome.localeCompare(b.nome,'pt')).forEach(e => {
      const tr = el('tr');
      let h = `<td>${studentLink(KEY_OF_ASF[e.aid+'|'+e.turma]||'', e.nome)}</td>`;
      discs.forEach(d => {
        const x = e.byDisc[d];
        if (!x || !x.inf) { h += '<td class="hm muted">·</td>'; return; }
        const p = faltaPct(x);
        h += `<td class="hm" style="${faltaColor(p)}" data-tip="<b>${esc(e.nome)} — ${esc(d)}</b>${x.f} faltas${x.j?' + '+x.j+' justificadas':''} em ${x.inf} aulas (${pct(p)})${x.datasF.length?'<br>'+x.datasF.map(s=>s.replace(/^(\d{4})-(\d{2})-(\d{2})/, '$3/$2')).join(', '):''}">${x.f+x.j}</td>`;
      });
      const p = faltaPct(e.tot);
      h += `<td><b>${e.tot.f+e.tot.j}</b></td><td>${e.tot.inf}</td><td style="${faltaColor(p)}">${pct(p)}</td>`;
      tr.innerHTML = h; tb.appendChild(tr);
    });
    const tf = el('tr',{class:'foot'});
    let fh = '<td>Turma (% faltas)</td>';
    discs.forEach(d => { let f=0,inf=0; studs.forEach(e=>{ const x=e.byDisc[d]; if(x){ f+=x.f+x.j; inf+=x.inf; } }); fh += `<td class="hm">${inf?pct(f/inf):'—'}</td>`; });
    let f=0,inf=0; studs.forEach(e=>{ f+=e.tot.f+e.tot.j; inf+=e.tot.inf; });
    fh += `<td>${f}</td><td>${inf}</td><td>${inf?pct(f/inf):'—'}</td>`;
    tf.innerHTML = fh; tb.appendChild(tf);
    tbl.appendChild(tb); panel.appendChild(tbl); root.appendChild(panel);
  });
}

/* ============================================================ RECUPERAÇÃO
   Mesmos critérios do Relatório de Recuperação entregue à Supervisão Geral:
   - obrigatória: média da disciplina no trimestre (nota da fase) abaixo de 7,0;
   - disciplinas com frentes (Matemática, Física, Química e Biologia A/B; Ciências A/B ou 1/2): vale a média
     aritmética das frentes, sem arredondar; média ≥ 7 com uma frente < 7 = recuperação FACULTATIVA;
   - resultado: média final = média entre as frentes da maior nota (fase × recuperação).
     RECUPEROU = média final ≥ 7 · NÃO RECUPEROU = fez a prova e ficou < 7 · SEM NOTA = prova ainda não lançada;
   - base: alunos com ao menos uma AQ lançada no trimestre; fora: 3ª séries, Ed. Física e disciplinas sem nota. */
const REC_FRENTE = {28:'Biologia',29:'Biologia',26:'Física',27:'Física',24:'Química',25:'Química',22:'Matemática',23:'Matemática',131:'Matemática',143:'Ciências',144:'Ciências',132:'Ciências',133:'Ciências'};
const REC_FORA_DISC = new Set([12,37,128,38,62,124]);          // Ed. Física, Projeto de Vida, Jornada, Empreendedorismo, Socioemocional, Revisão de Física
const REC_FORA_ALUNO = new Set(['1301|219']);                  // pedido da Direção (05/10/2026): fora das listas e da base
const REC_ST = {
  recuperou: {label:'Recuperou',        cor:'var(--brand-teal)',    badge:'ok'},
  nao:       {label:'Não recuperou',    cor:'var(--brand-magenta)', badge:'bad'},
  semnota:   {label:'Sem nota lançada', cor:'var(--ink-3)',         badge:'neutral'}
};
const turmaOrd = t => { const m = /^(\d)(º|ª)/.exec(t); const n = m ? +m[1] + (m[2]==='ª' ? 10 : 0) : 99; return (/Bessa$/.test(t) ? 0 : 100) + n; };
/* casos de recuperação. opts: {tris:[...], aid, turma, todasSeries} → {casos, base} */
function recCases(opts={}) {
  const tris = opts.tris || TRIS;
  const rows = DATA.asf_rows.filter(r => tris.includes(r.tri) && (opts.todasSeries || r.serie!=='3ª série') && !REC_FORA_ALUNO.has(r.aid+'|'+r.tid)
    && (opts.aid==null || r.aid===opts.aid) && (!opts.turma || r.turma===opts.turma));
  const base = {};                                               // aluno|turma|tri → avaliado (tem AQ no trimestre)
  rows.forEach(r => { if (r.aq!=null) base[r.aid+'|'+r.turma+'|'+r.tri] = {aid:r.aid, nome:r.aluno, unit:r.unit, serie:r.serie, turma:r.turma, tri:r.tri}; });
  const grp = {};
  rows.forEach(r => {
    if (REC_FORA_DISC.has(r.did)) return;
    const bk = r.aid+'|'+r.turma+'|'+r.tri; if (!base[bk]) return;
    const g = REC_FRENTE[r.did] || r.disc;
    (grp[bk+'|'+g] = grp[bk+'|'+g] || {aid:r.aid, nome:r.aluno, unit:r.unit, serie:r.serie, turma:r.turma, tri:r.tri, disc:g, fr:[]}).fr.push(r);
  });
  const casos = [];
  Object.values(grp).forEach(c => {
    if (!c.fr.some(f=>f.media!=null)) return;                    // disciplina sem nota no trimestre
    c.fr.sort((a,b)=>a.disc.localeCompare(b.disc,'pt'));
    const tri0 = c.fr.map(f=>f.media ?? 0);
    c.mTri = mean(tri0);
    c.tipo = c.mTri < 7 ? 'obrig' : (Math.min(...tri0) < 7 ? 'fac' : null);
    if (!c.tipo) return;
    c.mFinal = mean(c.fr.map(f=>f.final ?? 0));
    const fezProva = c.fr.some(f=>f.rec!=null);
    c.status = c.tipo==='obrig' ? (c.mFinal >= 7 ? 'recuperou' : fezProva ? 'nao' : 'semnota') : (fezProva ? (c.fr.every(f=>(f.final??0)>=7) ? 'recuperou' : 'nao') : 'semnota');
    c.key = KEY_OF_ASF[c.aid+'|'+c.turma] || '';
    casos.push(c);
  });
  return {casos, base: Object.values(base)};
}
/* barras horizontais empilhadas: items = [{label, tip, segs:[{v, cor, nome}], extra}] */
function stackedBars(items, opts={}) {
  const labelW = opts.labelW ?? 190, W = opts.width ?? 860, rowH = 26, barH = 16, chartW = W - labelW - 150;
  const max = Math.max(1, ...items.map(i=>i.segs.reduce((s,x)=>s+x.v,0)));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${items.length*rowH+6}" role="img" style="width:100%;max-width:${W}px">`;
  items.forEach((it,i) => {
    const y = i*rowH + 4; let x = labelW; const tot = it.segs.reduce((a,b)=>a+b.v,0);
    s += `<text x="${labelW-8}" y="${y+barH-4}" text-anchor="end" style="font-size:11.5px">${esc(it.label)}</text>`;
    it.segs.forEach(g => { if (!g.v) return; const w = chartW*g.v/max;
      s += `<rect x="${x}" y="${y}" width="${Math.max(1.5,w-1)}" height="${barH}" rx="3" fill="${g.cor}" data-tip="<b>${esc(it.label)}</b>${esc(g.nome)}: ${g.v}${tot?` (${Math.round(100*g.v/tot)}%)`:''}"></rect>`;
      if (w >= 20) s += `<text x="${x+w/2}" y="${y+barH-4}" text-anchor="middle" style="font-size:10.5px;fill:#fff;font-weight:700;pointer-events:none">${g.v}</text>`;
      x += w; });
    s += `<text class="val" x="${x+6}" y="${y+barH-4}" style="font-size:10.5px">${esc(it.extra ?? String(tot))}</text>`;
  });
  return s + '</svg>';
}
const recFrentes = (c, k) => c.fr.map(f => f[k]==null ? (k==='rec' ? (f.emRec ? 's/ nota' : '·') : '—') : fmt(f[k])).join(' · ');
const recBadge = c => `<span class="badge ${REC_ST[c.status].badge}">${REC_ST[c.status].label}</span>`;
const tipoBadge = c => c.tipo==='obrig' ? '<span class="badge bad">Obrigatória</span>' : '<span class="badge warn">Facultativa</span>';

  const mediaAluno = k => mean(notas.filter(r=>r[k]!=null).map(r=>r[k]));
  const mediaTurma = k => mean(notasTurma.filter(r=>r[k]!=null).map(r=>r[k]));
  const discsBaixas = [...new Set(notas.filter(r => { const v = r.media!=null ? r.media : (r.ae1!=null||r.ae2!=null ? mean([r.ae1,r.ae2].filter(x=>x!=null)) : null); return v!=null && v < 7; }).map(r=>r.disc))];   // disciplina sem nota não conta como "< 7"
  const gkFracos = gk.filter(d=>d.resp>=5 && d.ok/d.resp<=0.5).map(d=>`${d.disc} (${pct(d.ok/d.resp)})`);
  const gkBaixoEng = gk.filter(d=>d.total>=3 && d.fez/d.total<0.6).map(d=>`${d.disc} (${d.fez}/${d.total})`);
  const faltasDiscs = fs ? Object.entries(fs.byDisc).filter(([d,x])=>faltaPct(x)!=null && faltaPct(x)>=0.25).map(([d,x])=>`${d} (${pct(faltaPct(x))})`) : [];

  return {recs, sel, nome, turma, tris, notas, notasTurma, fs, oc, gk, eng:{T,F,R,K}, engTurma:{TT,TF,TR,TK}, badWeeks, mediaAluno, mediaTurma, discsBaixas, gkFracos, gkBaixoEng, faltasDiscs, ag};
}
function ruleAnalysis(d) {

      (d.badWeeks.length ? `Houve ${d.badWeeks.length} semana${d.badWeeks.length>1?'s':''} com 3 ou mais atividades não feitas (${d.badWeeks.map(brDate).join(', ')}), sinal de desorganização de rotina ou desmotivação. ` : '') +

  return p.join('\n\n');
}

  const system = 'Você é assessor pedagógico da Direção de Desempenho da Escola Habilis (João Pessoa, PB). Escreva em português do Brasil, tom técnico e humano, sem jargão vazio. Analise os dados do aluno de forma integrada (notas, Geekie, frequência, ocorrências), aponte causas prováveis, relacione os indicadores entre si e proponha ações concretas, com responsável e prazo, para coordenação, professores e família. Não invente dados; quando faltar informação, diga o que verificar. Formato: 4 a 7 parágrafos curtos com títulos em maiúsculas (DESEMPENHO ACADÊMICO, RECUPERAÇÕES quando houver, ENGAJAMENTO NO GEEKIE, FREQUÊNCIA, CONVIVÊNCIA, SÍNTESE E PROPOSTAS), sem markdown, sem listas com asteriscos. Termine com uma linha "Prioridade de intervenção: ALTA/MÉDIA/BAIXA".';
  const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model, max_tokens: 1800, system, messages:[{role:'user', content:'Dados do aluno:\n\n'+dossierText(d)+'\n\nEscreva a análise técnica e as propostas.'}]})});
  if (!r.ok) { let m = 'HTTP '+r.status; try { const j = await r.json(); m += ' — '+(j.error?.message||''); } catch(e){} throw new Error(m); }
  const j = await r.json();
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
}
function tabRelatorio(root) {
  root.appendChild(el('h2',{class:'noprint'}, 'Exportar relatório do aluno'));
  root.appendChild(el('p',{class:'hint noprint'}, 'Selecione um <b>aluno</b> no filtro. O relatório compila notas, presença, ocorrências, desempenho e engajamento no Geekie para o trimestre escolhido (ou o ano) e gera a análise técnica. Use <b>Imprimir / salvar PDF</b> para exportar.'));
  if (!state.aluno) { root.appendChild(el('div',{class:'notice noprint'}, 'Escolha um aluno no filtro acima para montar o relatório.')); return; }
  const d = studentDossier();
  const key = d.nome+'|'+state.tri+'|'+state.unit;
  if (!state.report || state.report.key!==key) state.report = {key, text: ruleAnalysis(d), source:'regras'};
  /* toolbar */
  const tb = el('div',{class:'toolbar noprint'});
  const bPrint = el('button',{class:'primary'}, '🖨️ Imprimir / salvar PDF'); bPrint.onclick = () => window.print();
  const bAI = el('button',{class:'primary magenta'}, '✨ Gerar análise com IA');
  const bRules = el('button',{class:'ghost'}, 'Refazer análise automática');
  const bCfg = el('button',{class:'ghost'}, '⚙️ Configurar IA');
  const status = el('span',{class:'muted', style:'font-size:.8rem'}, `Análise atual: ${state.report.source}`);
  bRules.onclick = () => { state.report = {key, text: ruleAnalysis(d), source:'regras'}; render(); };
  bAI.onclick = async () => { bAI.disabled = true; status.textContent = 'Gerando com IA…'; try { const t = await aiAnalysis(d); state.report = {key, text:t, source:'IA ('+(localStorage.getItem('hab_ai_model')||'claude-sonnet-5')+')'}; render(); } catch(e) { status.textContent = 'Erro: '+e.message; bAI.disabled = false; } };
  bCfg.onclick = () => {
    const bg = el('div',{class:'modal-bg'});
    bg.innerHTML = `<div class="modal"><h3>Configurar análise por IA</h3>
      <p class="hint">A chave fica salva só neste navegador (localStorage) e é enviada diretamente à API da Anthropic. Cada análise consome créditos da sua conta.</p>
      <label>Chave da API (sk-ant-…)</label><input type="password" id="aiKey" value="${esc(localStorage.getItem('hab_ai_key')||'')}" placeholder="sk-ant-api03-…">
      <label>Modelo</label><select id="aiModel">${['claude-sonnet-5','claude-opus-5','claude-haiku-4-5-20251001'].map(m=>`<option${(localStorage.getItem('hab_ai_model')||'claude-sonnet-5')===m?' selected':''}>${m}</option>`).join('')}</select>
      <div class="row"><button class="ghost" id="aiClear">Apagar chave</button><button class="ghost" id="aiCancel">Fechar</button><button class="primary" id="aiSave">Salvar</button></div></div>`;
    document.body.appendChild(bg);
    bg.querySelector('#aiCancel').onclick = () => bg.remove();
    bg.querySelector('#aiClear').onclick = () => { localStorage.removeItem('hab_ai_key'); bg.remove(); };
    bg.querySelector('#aiSave').onclick = () => { localStorage.setItem('hab_ai_key', bg.querySelector('#aiKey').value.trim()); localStorage.setItem('hab_ai_model', bg.querySelector('#aiModel').value); bg.remove(); };
  };
  tb.append(bPrint, bAI, bRules, bCfg, status);
  root.appendChild(tb);

  /* relatório */
  const rep = el('div',{class:'report'});
  const per = state.tri===0 ? 'Ano letivo 2026 (1º ao 3º trimestre)' : `${state.tri}º trimestre de 2026`;
  rep.innerHTML = `<div class="rhead"><svg width="120" height="31" viewBox="0 0 220 56"><path fill="#f9b233" d="M 8 10 Q 8 5.5 12.5 6 L 20.5 7 L 20.5 22 L 33.5 22 L 33.5 7 L 41.5 6 Q 46 5.5 46 10 L 46 46 Q 46 50.5 41.5 50 L 33.5 49 L 33.5 34 L 20.5 34 L 20.5 49 L 12.5 50 Q 8 50.5 8 46 Z"/><text x="56" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="33" font-weight="800" fill="currentColor">habilis</text></svg>
    <div><h2>Relatório de acompanhamento — ${esc(d.nome)}</h2><div class="sub">${esc(d.turma)}${d.sel?' · matrícula '+esc(d.sel.matricula):''} · ${per} · Direção de Desempenho · dados de ${brDateFull(DATA.extraido_em)}</div></div></div>`;
  /* KPIs */
  const mA = d.mediaAluno('media') ?? d.mediaAluno('ae1'), mT = d.mediaTurma('media') ?? d.mediaTurma('ae1');
  const eng = d.eng.T ? d.eng.F/d.eng.T : null, perf = d.eng.R ? d.eng.K/d.eng.R : null;
  const rOb = d.recs.filter(c=>c.tipo==='obrig');
  const kp = el('div',{class:'kpis'});

  kp.innerHTML = kpi('Média das provas', fmt(mA), mT!=null?`turma ${fmt(mT)}`:'') + kpi('Disciplinas < 7', String(d.discsBaixas.length), d.discsBaixas.slice(0,3).join(', ')) +
    (rOb.length ? kpi('Recuperações', `${rOb.filter(c=>c.status==='recuperou').length}/${rOb.length}`, `recuperadas · ${rOb.filter(c=>c.status!=='recuperou').length} ainda < 7`) : '') +
    kpi('Engajamento Geekie', pct(eng), `${d.eng.F}/${d.eng.T} atividades`) + kpi('Desempenho Geekie', pct(perf), `${d.eng.K}/${d.eng.R} questões`) +
    kpi('Faltas', d.fs? `${d.fs.tot.f+d.fs.tot.j}` : '—', d.fs? `${pct(faltaPct(d.fs.tot))} de ${d.fs.tot.inf} aulas` : 'sem diário') + kpi('Ocorrências', String(d.oc.length), d.oc.length?`última ${brDate(d.oc[0].dt)}`:'');

  /* recuperações */
  rep.appendChild(el('h3',{}, `2. Recuperações (${d.recs.length})`));
  if (d.recs.length) {
    rep.appendChild(recCaseTable(d.recs, {tri: d.tris.length>1}));
    rep.appendChild(el('p',{class:'muted', style:'font-size:.78rem'}, 'Obrigatória: média da disciplina abaixo de 7 (nas disciplinas com frentes, média entre as frentes). Facultativa: média ≥ 7 com uma frente abaixo de 7. Média final: média entre as frentes da maior nota (fase × recuperação).'));
  } else rep.appendChild(el('p',{class:'muted'}, 'Nenhuma disciplina em recuperação no período.'));
  /* presença */
  rep.appendChild(el('h3',{}, '3. Presença'));
  if (d.fs && d.fs.tot.inf) {
    const t = el('table',{class:'grid'}); t.innerHTML = '<thead><tr><th>Disciplina</th><th>Aulas</th><th>Faltas</th><th>Justif.</th><th>%</th><th>Datas</th></tr></thead>';
    const b = el('tbody');
    Object.entries(d.fs.byDisc).sort((a,b)=>a[0].localeCompare(b[0],'pt')).forEach(([disc,x]) => { if (!x.inf) return; const tr = el('tr'); const p=faltaPct(x); tr.innerHTML = `<td>${esc(disc)}</td><td>${x.inf}</td><td>${x.f}</td><td>${x.j}</td><td style="${faltaColor(p)}">${pct(p)}</td><td class="wrap muted">${x.datasF.map(s=>s.replace(/^(\d{4})-(\d{2})-(\d{2})/, '$3/$2')).join(', ')||'—'}</td>`; b.appendChild(tr); });
    const tf = el('tr',{class:'foot'}); tf.innerHTML = `<td>Total</td><td>${d.fs.tot.inf}</td><td>${d.fs.tot.f}</td><td>${d.fs.tot.j}</td><td style="${faltaColor(faltaPct(d.fs.tot))}">${pct(faltaPct(d.fs.tot))}</td><td></td>`; b.appendChild(tf);
    t.appendChild(b); rep.appendChild(t);
  } else rep.appendChild(el('p',{class:'muted'}, 'Sem aulas com frequência lançada no período.'));
  /* ocorrências */
  rep.appendChild(el('h3',{}, `4. Ocorrências disciplinares (${d.oc.length})`));
  if (d.oc.length) rep.appendChild(ocorrList(d.oc)); else rep.appendChild(el('p',{class:'muted'}, 'Nenhuma ocorrência registrada no período.'));
  /* geekie */
  rep.appendChild(el('h3',{}, '5. GeekieOne — desempenho e engajamento'));
  if (d.gk.length) {
    const t = el('table',{class:'grid'}); t.innerHTML = '<thead><tr><th>Disciplina</th><th>Atividades</th><th>Feitas</th><th>Engaj.</th><th>Questões</th><th>Acertos</th><th>Desemp.</th></tr></thead>';
    const b = el('tbody');
    d.gk.forEach(x => { const tr = el('tr'); const p = x.resp?x.ok/x.resp:null; tr.innerHTML = `<td>${esc(x.disc)}</td><td>${x.total}</td><td>${x.fez}</td><td class="${x.total&&x.fez/x.total<0.6?'bad':''}">${x.total?pct(x.fez/x.total):'—'}</td><td>${x.resp}</td><td>${x.ok}</td><td class="${p!=null&&p<=0.5?'bad':''}">${pct(p)}</td>`; b.appendChild(tr); });
    const tf = el('tr',{class:'foot'}); tf.innerHTML = `<td>Total</td><td>${d.eng.T}</td><td>${d.eng.F}</td><td>${pct(eng)}</td><td>${d.eng.R}</td><td>${d.eng.K}</td><td>${pct(perf)}</td>`; b.appendChild(tf);
    t.appendChild(b); rep.appendChild(t);
    if (d.badWeeks.length) rep.appendChild(el('p',{class:'muted', style:'font-size:.82rem'}, `Semanas com 3+ atividades não feitas: ${d.badWeeks.map(brDate).join(', ')}.`));
  } else rep.appendChild(el('p',{class:'muted'}, 'Sem atividades do Geekie no período.'));
  /* análise */
  rep.appendChild(el('h3',{}, `6. Análise técnica e propostas <span class="muted" style="font-size:.75rem;font-weight:400">(${esc(state.report.source)})</span>`));
  rep.appendChild(el('div',{class:'analysis'}, esc(state.report.text)));
  rep.appendChild(el('p',{class:'muted', style:'font-size:.75rem;margin-top:18px'}, `Gerado pelo Painel de Desempenho Habilis em ${new Date().toLocaleDateString('pt-BR')}. Fontes: ActiveSoft (notas, frequência, ocorrências) e GeekieOne (atividades).`));
  root.appendChild(rep);
}

const famR1 = x => x==null ? null : Math.round((x + 1e-9) * 10) / 10;       // arredondamento do ActiveSoft (1 casa, meio para cima)
function famArea(disc) {

  if (/biolog|fisic|quimic|cienc/.test(d)) return 'Ciências da Natureza';
  if (/histor|geogr|filos|sociol/.test(d)) return 'Ciências Humanas';

/* nome "bonito" da frente: Química- Frente B → Química – Frente B; Filosofia/sociologia → Filosofia/Sociologia; Língua Estrangeira - Inglês → Inglês */
function famNice(disc) {

/* frequência de um aluno no ano (sem depender dos filtros globais) */
function famFreq(aid, turma, tris) {

  const today = DATA.extraido_em;

    const pt = out.porTri[fr.tri] = out.porTri[fr.tri] || {f:0,j:0,inf:0};
    for (let i=0;i<st.length;i++) {

function famLoadScript(src) { return new Promise((ok, err) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => err(new Error('não carregou '+src)); document.head.appendChild(s); }); }
async function famDocxText(buf) {
  await famLoadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');

  const doc = new DOMParser().parseFromString(xml, 'application/xml');

  const textOf = node => [...node.getElementsByTagName('w:t')].map(t=>t.textContent).join('').replace(/\s+/g,' ').trim();
  const paragraphs = [], tables = [];
  [...body.children].forEach(n => {
    if (n.localName==='p') { const t = textOf(n); const isList = n.getElementsByTagName('w:numPr').length>0; if (t) paragraphs.push((isList?'• ':'')+t); }
    else if (n.localName==='tbl') { const rows = [...n.getElementsByTagName('w:tr')].map(tr => [...tr.getElementsByTagName('w:tc')].map(textOf)); tables.push(rows); rows.forEach(r => paragraphs.push(r.join(' | '))); }
  });

}

  const fecho = [
    `Se eu tivesse que resumir este relatório em uma frase, seria esta: ${cresceu ? `${g.a} ${nome} mostrou, no ${B}º trimestre, que responde ao acompanhamento` : `${g.a} ${nome} tem um caminho claro para o ${prox}`}. ${d.abaixoPosB.length ? `Os desafios que restam — ${d.abaixoPosB.map(f=>f.short).join(', ')} — estão identificados, têm metas numéricas e um plano compartilhado entre a Assessoria, os professores e a Direção de Desempenho.` : 'Não há pendência aberta, e o foco passa a ser sustentar o patamar e aprofundar.'}`,
    `O que peço ${T.obj==='lhe' ? 'a '+T.trat : 'a vocês'} é o que já ${T.obj==='lhe' ? 'tem' : 'têm'} feito: estar perto. Perguntar como foi a semana, reservar com ${g.ela} o bloco de estudo sem celular, celebrar as conquistas e nos avisar sempre que notar algo diferente — no humor, na rotina ou nas faltas. Do nosso lado, voltaremos a conversar ao fim do ${prox} com a mesma transparência deste documento.`,
    `Estou à disposição para uma conversa pessoal, quando for conveniente.`

  return {carta, areas, recup, rotina, assess, perfil, plano: plano.slice(0,4), papeis, fecho};

  d.gkAno.forEach(x => L.push(`- Geekie ${x.disc}: ${x.fez}/${x.total} · ${x.resp?pct(x.ok/x.resp):'—'} de acerto`));
  L.push(`FREQUÊNCIA: ${d.freq.tot.f+d.freq.tot.j} faltas em ${d.freq.tot.inf} aulas (${pct(d.freq.tot.inf?(d.freq.tot.f+d.freq.tot.j)/d.freq.tot.inf:null)}). ` + Object.entries(d.freq.byDisc).filter(([k,x])=>x.f+x.j).map(([k,x])=>`${k}: ${x.f+x.j}/${x.inf} (${x.datasF.map(s=>s.slice(5)).join(', ')})`).join('; '));

}

  /* 8 frequência + convivência */
