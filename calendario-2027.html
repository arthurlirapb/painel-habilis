<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
<title>Calendário Habilis 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app de uma tela no padrão Calendário Apple — barra superior (visões Dia/Semana/Mês/Ano), barra lateral (mini-calendário + filtros) e área principal. Tokens herdados do Painel Habilis. */
:root{
  color-scheme:light;
  --surface:#fcfcfb; --surface-2:#f4f3f0; --card:#ffffff;
  --ink:#1c1c1c; --ink-2:#52514e; --ink-3:#8a897f;
  --brand-yellow:#f9b233; --brand-magenta:#a93a8d; --brand-teal:#52a8b0;
  --line:#e6e4de; --line-2:#efede8;
  --today:#e5413b; --sel:#1c1c1c; --sel-ink:#ffffff;
  --off:#f7f6f2; --shadow:0 12px 36px rgba(28,28,28,.16),0 2px 6px rgba(28,28,28,.08);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --radius:10px;
  font-size:15px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --surface:#17171c; --surface-2:#1f1f26; --card:#22222a;
  --ink:#f4f4f0; --ink-2:#c3c2b7; --ink-3:#8a897f;
  --line:#34343c; --line-2:#2a2a32; --today:#ff5a52; --sel:#f4f4f0; --sel-ink:#17171c;
  --off:#1b1b21; --shadow:0 14px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#17171c; --surface-2:#1f1f26; --card:#22222a;
  --ink:#f4f4f0; --ink-2:#c3c2b7; --ink-3:#8a897f;
  --line:#34343c; --line-2:#2a2a32; --today:#ff5a52; --sel:#f4f4f0; --sel-ink:#17171c;
  --off:#1b1b21; --shadow:0 14px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-teal);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* barra da marca (some quando embutido no painel) */
.brand{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.brand .sub{color:var(--ink-3);font-size:.8rem}
.brand .badge{white-space:nowrap;margin-left:auto;font-size:.72rem;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
body.emb .brand{display:none}

/* barra de ferramentas */
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.ib{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.ib:hover{background:var(--surface-2)}
.ib.on{color:var(--ink);background:var(--surface-2);border-color:var(--line)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 14px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:.86rem}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tb .center{flex:1;display:flex;justify-content:center}
.search{position:relative}
.search input{width:210px;max-width:46vw;padding:6px 10px 6px 30px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:min(380px,92vw);max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:6px}
.sres .r{display:flex;gap:10px;padding:7px 8px;border-radius:8px;align-items:flex-start;cursor:pointer}
.sres .r:hover{background:var(--surface-2)}
.sres .r .dt{width:74px;flex:none;color:var(--ink-3);font-size:.78rem;font-variant-numeric:tabular-nums;padding-top:1px}
.sres .empty{padding:12px;color:var(--ink-3)}

/* corpo */
.body{flex:1;display:flex;min-height:0;position:relative}
.side{width:262px;flex:none;border-right:1px solid var(--line);background:var(--card);overflow:auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:18px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.vhead{display:flex;align-items:flex-end;gap:12px;padding:14px 18px 10px;flex-wrap:wrap}
.vtitle{font-size:1.75rem;font-weight:300;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.vtitle b{font-weight:700}
.vsub{color:var(--ink-3);font-size:.85rem;margin-top:3px}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav .ib{font-size:1.05rem;padding:4px 10px}
.nav .today{border:1px solid var(--line);font-size:.85rem;padding:4px 12px;color:var(--ink)}
.view{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}

/* barra lateral */
.sh{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin:0 0 8px}
.mini .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mini .mh b{font-size:.92rem}
.mini table{width:100%;border-collapse:collapse;table-layout:fixed}
.mini th{font-size:.66rem;color:var(--ink-3);font-weight:600;padding:2px 0}
.mini td{text-align:center;padding:1px 0}
.mini td button{width:26px;height:26px;border-radius:50%;border:0;background:transparent;font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--ink);position:relative}
.mini td button:hover{background:var(--surface-2)}
.mini td.out button{color:var(--ink-3);opacity:.55}
.mini td.has button{font-weight:700}
.mini td.we button{color:var(--ink-3)}
.mini td.sel button{background:var(--sel);color:var(--sel-ink)}
.mini td.tdy button{color:var(--today);font-weight:700}
.mini td.sel.tdy button{background:var(--today);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:.78rem;color:var(--ink-2)}
.pill.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.pill:disabled{opacity:.35;cursor:not-allowed}
.cats{display:flex;flex-direction:column;gap:2px}
.cat .row{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:7px}
.cat .row:hover{background:var(--surface-2)}
.ck{width:15px;height:15px;border-radius:4px;border:2px solid var(--c);flex:none;display:inline-flex;align-items:center;justify-content:center;background:transparent;padding:0}
.ck.on{background:var(--c)}
.ck.part{background:linear-gradient(135deg,var(--c) 50%,transparent 50%)}
.ck svg{opacity:0}
.ck.on svg{opacity:1}
.cat .nm{flex:1;min-width:0;font-size:.86rem;cursor:pointer;user-select:none}
.cat .ct{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cat .chev{border:0;background:transparent;color:var(--ink-3);padding:0 2px;transition:transform .15s}
.cat.open .chev{transform:rotate(90deg)}
.cat .subs{display:none;padding-left:22px}
.cat.open .subs{display:block}
.cat .subs .row{padding:3px 4px}
.cat .subs .ck{width:12px;height:12px;border-radius:50%}
.cat .subs .nm{font-size:.8rem;color:var(--ink-2)}
.side .note{font-size:.74rem;color:var(--ink-3);line-height:1.45}

/* eventos (comuns) */
.ev{--c:#888;font-size:.74rem;line-height:18px;height:18px;padding:0 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0;position:relative;z-index:1}
.ev.ad{background:color-mix(in srgb,var(--c) 20%,var(--card));color:color-mix(in srgb,var(--c) 55%,var(--ink));font-weight:500;border-left:3px solid var(--c)}
.ev.ad.solid{background:var(--c);color:#fff;border-left-color:transparent}
.ev.ad.cl{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:transparent}
.ev.ad.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.ev.tm{color:var(--ink);display:flex;align-items:center;gap:5px;padding:0 4px}
.ev.tm:hover,.ev.ad:hover{filter:brightness(.96)}
.ev.tm i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.ev.tm .h{flex:none;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev.tm span{overflow:hidden;text-overflow:ellipsis}
.ev.dash{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--card)) 0 6px,color-mix(in srgb,var(--c) 8%,var(--card)) 6px 12px)}
.ev.mine{--c:#8a897f}
.ev.hit{outline:2px solid var(--c);outline-offset:1px}

/* mês */
.month{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.dow div{font-size:.72rem;color:var(--ink-3);text-align:right;padding:6px 8px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.weeks{flex:1;display:grid;min-height:0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;border-bottom:1px solid var(--line);min-height:0;overflow:hidden;padding-bottom:2px}
.cell{grid-row:1/-1;border-right:1px solid var(--line-2);padding:4px 6px;display:flex;justify-content:flex-end;align-items:flex-start;cursor:default;z-index:0}
.cell:nth-child(7n){border-right:0}
.cell.off{background:var(--off)}
.cell.selc{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-teal) 70%,transparent)}
.dn{border:0;background:transparent;min-width:24px;height:24px;border-radius:12px;font-size:.84rem;font-variant-numeric:tabular-nums;padding:0 6px;color:var(--ink)}
.dn:hover{background:var(--surface-2)}
.cell.out .dn{color:var(--ink-3)}
.cell.hol .dn{color:var(--today)}
.cell.tdy .dn{background:var(--today);color:#fff;font-weight:700}
.dn .m1{font-weight:700;margin-right:3px}
.more{font-size:.72rem;color:var(--ink-2);padding:0 6px;cursor:pointer;font-weight:600;z-index:1;white-space:nowrap}
.more:hover{color:var(--ink)}
/* mês compacto (celular) */
.mc .weeks{flex:none}
.mc .wk{height:54px;grid-template-rows:1fr!important}
.mc .cell{flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:4px 0;cursor:pointer}
.mc .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:30px}
.mc .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.daylist{flex:1;overflow:auto;padding:10px 16px 20px;border-top:1px solid var(--line)}
.daylist h4{margin:4px 0 8px;font-size:.92rem}
.li{display:flex;gap:10px;padding:8px 10px;border-radius:9px;align-items:flex-start;cursor:pointer;background:var(--card);border:1px solid var(--line-2);margin-bottom:6px}
.li .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.li .tt{font-weight:600;font-size:.86rem}
.li .mt{font-size:.76rem;color:var(--ink-3);margin-top:2px}

/* semana e dia */
.tw{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line)}
.tg{display:grid;grid-template-columns:54px repeat(var(--n),minmax(0,1fr));scrollbar-gutter:stable}
.th{border-bottom:1px solid var(--line);overflow-y:hidden}
.th .h{padding:6px 6px 6px;text-align:center;font-size:.78rem;color:var(--ink-2);border-left:1px solid var(--line-2)}
.th .h b{display:inline-flex;min-width:26px;height:26px;border-radius:13px;align-items:center;justify-content:center;font-size:1.02rem;margin-left:4px;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 4px}
.th .h.tdy b{background:var(--today);color:#fff}
.th .h.hol{color:var(--today)}
.th .h button{border:0;background:transparent;padding:0;color:inherit}
.alld{border-bottom:1px solid var(--line);max-height:38%;overflow-y:auto;flex:none}
.alld .lab{grid-row:1/-1;font-size:.68rem;color:var(--ink-3);text-align:right;padding:4px 6px 0 0}
.alld .col{grid-row:1/-1;border-left:1px solid var(--line-2)}
.alld .col.off{background:var(--off)}
.alld .ev{margin:0 2px}
.tsc{flex:1;overflow-y:auto;min-height:0}
.tgrid{position:relative}
.hr{height:46px;border-top:1px solid var(--line-2);font-size:.68rem;color:var(--ink-3);text-align:right;padding-right:6px;transform:translateY(0)}
.hr span{position:relative;top:-8px;background:var(--surface);padding-left:2px}
.dcol{border-left:1px solid var(--line-2);position:relative}
.dcol.off{background:var(--off)}
.tev{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 22%,var(--card));border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 50%,var(--ink));z-index:1}
.tev b{display:block;font-weight:600}
.tev .h{font-variant-numeric:tabular-nums;opacity:.85}
.dayv{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.dpanel{border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--card)}
.dpanel h3{margin:0 0 10px;font-size:1rem}
.st{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.82rem;margin-bottom:16px}
.st .k{color:var(--ink-3)}
.st .v b{font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.7rem;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:1px 8px;margin:2px 3px 2px 0;color:var(--ink-2)}
.chip.ok{border-color:color-mix(in srgb,#2f7f87 40%,var(--line));color:color-mix(in srgb,#2f7f87 70%,var(--ink))}
.chip.no{color:var(--ink-3)}

/* ano */
.year{flex:1;overflow:auto;padding:6px 18px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 26px;align-content:start;border-top:1px solid var(--line);padding-top:16px}
.ym h4{margin:0 0 6px;font-size:1rem;color:var(--today);font-weight:600}
.ym h4 button{border:0;background:transparent;padding:0;color:inherit;font-weight:inherit;font-size:inherit}
.ym table{width:100%;border-collapse:collapse;table-layout:fixed}
.ym th{font-size:.62rem;color:var(--ink-3);font-weight:600}
.ym td{text-align:center;padding:0}
.ym td button{border:0;background:transparent;width:100%;padding:3px 0 6px;border-radius:6px;font-size:.76rem;font-variant-numeric:tabular-nums;position:relative;color:var(--ink)}
.ym td button:hover{background:var(--surface-2)}
.ym td.we button{color:var(--ink-3)}
.ym td.hol button{color:var(--today)}
.ym td.fer button{background:color-mix(in srgb,#ee8e8e 14%,transparent)}
.ym td .dd{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:2px}
.ym td .dd i{width:4px;height:4px;border-radius:50%;background:var(--c)}
.ylegend{grid-column:1/-1;font-size:.76rem;color:var(--ink-3)}

/* popover */
.pop{position:fixed;z-index:80;width:min(360px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px 14px;max-height:80vh;overflow:auto}
.pop .pt{display:flex;gap:10px;align-items:flex-start}
.pop .pt i{width:12px;height:12px;border-radius:4px;background:var(--c);margin-top:5px;flex:none}
.pop h3{margin:0;font-size:1.06rem;line-height:1.3;text-wrap:balance}
.pop .when{color:var(--ink-2);font-size:.84rem;margin:6px 0 12px 22px}
.pop .kv{display:grid;grid-template-columns:86px 1fr;gap:6px 10px;font-size:.82rem;margin-left:22px}
.pop .kv .k{color:var(--ink-3)}
.pop .desc{font-size:.84rem;line-height:1.5;color:var(--ink-2);margin:12px 0 0 22px}
.pop .acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0 22px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:.8rem;color:var(--ink);text-decoration:none;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand-teal);border-color:var(--brand-teal);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.pop .x{position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--ink-3);font-size:1.1rem;border-radius:6px;padding:2px 7px}

/* informações */
.info{flex:1;overflow:auto;border-top:1px solid var(--line)}
.info .wrap{max-width:1040px;margin:0 auto;padding:18px 20px 40px}
.tabs2{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs2 button{border:0;background:transparent;padding:8px 12px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--brand-yellow)}
.info h2{font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
.info h3{font-size:.98rem;margin:22px 0 8px}
.info p,.info li{line-height:1.55;color:var(--ink-2);max-width:72ch}
.info ul{padding-left:18px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--brand-yellow)}
.kpi .l{font-size:.76rem;color:var(--ink-3)}
.kpi .n{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:.76rem;color:var(--ink-2)}
.kpi .s b{color:#2f7f87}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:.82rem}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.mo td{background:var(--surface);font-weight:700;color:var(--ink-2);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;margin:1px 0}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* modal Google */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,14,.42);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(620px,100%);max-height:88vh;overflow:auto;padding:22px 24px}
.modal h2{margin:0 0 4px;font-size:1.2rem}
.modal .lead{color:var(--ink-2);margin:0 0 16px;line-height:1.5}
.opt{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.opt h3{margin:0 0 4px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.opt h3 .n{width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:.72rem;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.opt p{margin:4px 0 10px;color:var(--ink-2);font-size:.84rem;line-height:1.5}
.opt .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.urlbox{display:flex;gap:6px;margin-top:8px}
.urlbox input,.opt input[type=text]{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.78rem}
.msg{font-size:.8rem;color:var(--ink-2);margin-top:8px;line-height:1.45}
details.adv summary{cursor:pointer;color:var(--ink-2);font-size:.84rem}

1</b>, para fechar os 200 dias sem avaliação aos sábados.","<b>Férias:</b> julho inteiro (01 a 31/07), como pede o sindicato. Volta às aulas em 02/08. O curso de férias da 3ª série (19 a 30/07) aparece no calendário, mas não conta como dia letivo.","<b>ENEM:</b> previsão para o 1º e o 2º domingos de novembro, <b>07 e 14/11/2027</b>. A 3ª série encerra o 3º trimestre em 16/10 e entra em 4 semanas de revisão: 2 gerais (18 a 29/10) e 2 de véspera (01 a 05/11 e 08 a 12/11). As recuperações e finais vêm depois do ENEM.","<b>Reposição e recuperação:</b> a reposição fica na semana depois da última prova do trimestre, e a recuperação (6º à 2ª) na semana seguinte. Na 3ª série, as recuperações continuam depois do ENEM. A reposição tem 5 dias úteis (se a semana tiver menos, continua na seguinte); a recuperação e as finais têm 4 dias (se a semana tiver 5, o último fica sem prova). No 1º trimestre, a reposição e a recuperação do 6º à 2ª foram adiadas uma semana por causa dos Jogos Internos.","<b>Fim de ano:</b> semana de plantão antes das finais em todos os segmentos. Provas finais de 13 a 16/12 na 3ª série, de 20 a 23/12 no 6º ao 8º e de 27 a 30/12 no 9º à 2ª, que faz a AE2 do 3º tri em 27/11 e 04/12. Conselho de Classe para todos em 03 e 04/01/2028, e resultado final em 05/01/2028.","<b>Evolucional 2027 (3ª série):</b> os 8 ciclos estão no calendário, nas datas oficiais. Os ciclos 1, 4 e 7, que caem mais perto do meio de cada trimestre, valem como AE1. Os ciclos 2, 3, 6 e 8 são facultativos. O ciclo 5 fica fora do calendário por enquanto: suas datas (12 e 19/06) ficaram com a AE2 autoral do 2º trimestre, e a forma de aplicação será decidida depois.","<b>Processo avaliativo mantido:</b> 6º ao 8º com AE1 e AE2 em semanas de provas por componente, mais simulado à tarde; 9º à 2ª com AE1 por componente e AE2 em simulado aos sábados; 3ª série com AE1 Evolucional e AE2 autoral, ambas aos sábados. A AQ fecha na última sexta-feira de cada trimestre."],"val":["<b>Datas do ENEM.</b> 07 e 14/11 são previsão (1º e 2º domingos de novembro). Se o INEP mudar, a reta final da 3ª série se desloca junto. A revisão começa 3 semanas antes do 1º dia, e as recuperações começam na segunda após o 2º dia.","<b>AE2 autoral do 1º trimestre da 3ª série em 27/03 e 03/04.</b> Os ciclos 2 e 3 da Evolucional ocupam 13, 20/03 e 10, 17/04. O único par livre antes do fim do trimestre começa em 27/03, que é o Sábado de Aleluia. Alternativa: dia 1 em 06/03, uma semana depois da AE1.","<b>Ciclo 5 da Evolucional.</b> Saiu do calendário porque as datas oficiais (12 e 19/06) ficaram com a AE2 autoral do 2º trimestre. Falta decidir como e quando aplicá-lo.","<b>Ciclo 6 da Evolucional em 31/07.</b> Cai nas férias de julho exigidas pelo sindicato. Como é facultativo, dá para aplicar só o dia 2 (07/08) ou pedir à Evolucional outra data.","<b>Evolucional do 9º à 2ª.</b> O calendário da Evolucional também tem 4 ciclos para essas séries: 13 e 20/03, 15 e 22/05, 21 e 28/08, 25/09 e 02/10. Se a escola for aplicar, 21 e 28/08 coincidem com a AE2 do 2º trimestre (poderiam ser a própria AE2).","<b>Fim de ano do 9º à 2ª.</b> As finais vão de 27 a 30/12, entre o Natal e o Ano-Novo. A AE2 do 3º tri em 04/12 divide o dia com o Habilis Day do 6º ao 8º e da 3ª série. Por isso os boletins do 9º à 2ª ficaram para 11/12.","<b>Conselho de Classe em 03 e 04/01/2028 e resultado em 05/01/2028.</b> Foram uma semana para depois das finais do 9º à 2ª, para todos os segmentos. Saem da grade de 2027, por isso aparecem só na legenda de dezembro e nos marcos.","<b>3ª série sem atividade em 26/11 e 03/12.</b> Com 4 dias de recuperação, essas sextas ficam livres. Podem virar plantão de dúvidas, se a Supervisão preferir.","<b>Sábados de evento.</b> Geekie Games, Habilis Tank, Habilis Cultural e o sábado de projeto do 6º ao 8º (15/05) contam como dia letivo desde que estejam na proposta pedagógica, com frequência obrigatória e professores orientando. Esse critério é mais amplo que o da conferência de 2026, que só function lanes(evs,start,n){
  const end=add(start,n-1),items=[];
  evs.forEach(e=>{if(e.E<start||e.S>end)return;
    const s=e.S<start?start:e.S,f=e.E>end?end:e.E;
    items.push({e,c0:Math.round((s-start)/864e5),c1:Math.round((f-start)/864e5),cl:e.S<start,cr:e.E>end})});
  items.sort((a,b)=>a.c0-b.c0||(b.c1-b.c0)-(a.c1-a.c0)||(a.e.timed-b.e.timed)||CORD[a.e.c]-CORD[b.e.c]);
  const occ=[];
  items.forEach(it=>{let l=0;while(occ[l]&&occ[l].some(([a,b])=>!(it.c1<a||it.c0>b)))l++;(occ[l]=occ[l]||[]).push([it.c0,it.c1]);it.lane=l});

}

}

const gd=d=>K(d).replace(/-/g,'');

  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.t)+'&dates='+dates+'&ctz=America/Fortaleza&details='+encodeURIComponent(det);
}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function fold(l){const out=[];while(l.length>73){out.push(l.slice(0,73));l=' '+l.slice(73)}out.push(l);return out.join('\r\n')}
function toICS(list,name){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Habilis//Calendario 2027//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(name),'X-WR-TIMEZONE:America/Fortaleza',
   'BEGIN:VTIMEZONE','TZID:America/Fortaleza','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:-0300','TZOFFSETTO:-0300','TZNAME:-03','END:STANDARD','END:VTIMEZONE'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  list.forEach(e=>{
    L.push('BEGIN:VEVENT','UID:'+e.id+'@habilis2027','DTSTAMP:'+stamp);
    if(e.timed){L.push(`DTSTART;TZID=America/Fortaleza:${gd(e.S)}T${e.h0.replace(':','')}00`,`DTEND;TZID=America/Fortaleza:${gd(e.S)}T${e.h1.replace(':','')}00`)}
    else L.push('DTSTART;VALUE=DATE:'+gd(e.S),'DTEND;VALUE=DATE:'+gd(add(e.E,1)));
    L.push('SUMMARY:'+icsEsc(e.t),'CATEGORIES:'+icsEsc(CATN[e.c]+' - '+e.sub),'DESCRIPTION:'+icsEsc([e.d,`${CATN[e.c]} · ${e.sub}`,e.ser.length===7?'Todas as séries':'Séries: '+e.ser.join(', '),'Unidades: '+e.uni.join(' e ')].filter(Boolean).join('\n')),'TRANSP:TRANSPARENT','END:VEVENT');
  });

}
function download(name,text){

}

let GTOK=null;
function loadGIS(){return new Promise((ok,no)=>{if(window.google?.accounts?.oauth2)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>no(new Error('Não consegui carregar o login do Google. Abra o calendário pelo painel (no navegador) e tente de novo.'));document.head.appendChild(s)})}
async function gToken(cid){await loadGIS();return new Promise((ok,no)=>{const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/calendar',callback:r=>r.error?no(new Error('Login não concluído: '+r.error)):ok(r.access_token)});tc.requestAccessToken()})}
async function gapi(path,opt={}){const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{...opt,headers:{Authorization:'Bearer '+GTOK,'Content-Type':'application/json'}});if(r.status===204)return null;const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erro '+r.status));return j}
function gBody(e){
  const b={summary:e.t,description:[e.d,`${CATN[e.c]} · ${e.sub}`,e.ser.length===7?'Todas as séries':'Séries: '+e.ser.join(', '),'Unidades: '+e.uni.join(' e ')].filter(Boolean).join('\n'),transparency:'transparent',extendedProperties:{private:{h27:e.id}}};
  if(e.timed){b.start={dateTime:`${e.s}T${e.h0}:00`,timeZone:'America/Fortaleza'};b.end={dateTime:`${e.s}T${e.h1}:00`,timeZone:'America/Fortaleza'}}
  else{b.start={date:e.s};b.end={date:K(add(e.E,1))}}
  return b;
}
async function gRun(sync){
  const msg=document.getElementById('gmsg'),cid=document.getElementById('gcid').value.trim();
  if(!/apps\.googleusercontent\.com$/.test(cid)){msg.textContent='Cole o ID do cliente, que termina em apps.googleusercontent.com.';return}
  try{localStorage.setItem(LS+'-gcid',cid)}catch(e){}
  try{
    msg.textContent='Abrindo o login do Google…';GTOK=await gToken(cid);
    if(sync){
      msg.textContent='Procurando a agenda “Habilis 2027”…';
      const cl=await gapi('/users/me/calendarList?maxResults=250');let cal=(cl.items||[]).find(c=>c.summary==='Habilis 2027');
      if(!cal)cal=await gapi('/calendars',{method:'POST',body:JSON.stringify({summary:'Habilis 2027',timeZone:'America/Fortaleza',description:'Calendário Letivo Habilis 2027 (gerado pelo painel)'})});
      const cidE=encodeURIComponent(cal.id);let have={},tok='';
      do{const r=await gapi(`/calendars/${cidE}/events?maxResults=2500&showDeleted=false${tok?'&pageToken='+tok:''}`);(r.items||[]).forEach(x=>{const k=x.extendedProperties?.private?.h27;if(k)have[k]=x});tok=r.nextPageToken||''}while(tok);
      const want=filtered();let n=0,c=0,u=0,d=0;
      for(const e of want){n++;const b=gBody(e),x=have[e.id];
        if(!x){await gapi(`/calendars/${cidE}/events`,{method:'POST',body:JSON.stringify(b)});c++}
        else{const same=x.summary===b.summary&&(x.start.date||x.start.dateTime?.slice(0,16))===(b.start.date||b.start.dateTime.slice(0,16))&&(x.end.date||x.end.dateTime?.slice(0,16))===(b.end.date||b.end.dateTime.slice(0,16));if(!same){await gapi(`/calendars/${cidE}/events/${x.id}`,{method:'PATCH',body:JSON.stringify(b)});u++}delete have[e.id]}
        if(n%10===0)msg.textContent=`Enviando ${n} de ${want.length}…`}
      for(const k in have){await gapi(`/calendars/${cidE}/events/${have[k].id}`,{method:'DELETE'});d++}
      msg.textContent=`Pronto: ${c} criados, ${u} atualizados, ${d} removidos da agenda “Habilis 2027”.`;
    }
    msg.textContent+=(sync?' ':'')+'Carregando seus compromissos…';
    const items=[];let tok='';
    do{const r=await gapi(`/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=2027-01-01T00:00:00-03:00&timeMax=2028-02-01T00:00:00-03:00${tok?'&pageToken='+tok:''}`);items.push(...(r.items||[]));tok=r.nextPageToken||''}while(tok);
    S.mine=items.filter(x=>x.status!=='cancelled').map((x,i)=>{const s=x.start.date||x.start.dateTime.slice(0,10);let e=x.end.date?K(add(P(x.end.date),-1)):x.end.dateTime.slice(0,10);if(e<s)e=s;
      return {id:'g-'+i,mine:true,c:'mine',sub:'Minha agenda',t:x.summary||'(sem título)',s,e,S:P(s),E:P(e),col:'#8a897f',timed:!!x.start.dateTime&&s===e,h0:x.start.dateTime?.slice(11,16),h1:x.end.dateTime?.slice(11,16),d:x.location||''}});
    msg.textContent=msg.textContent.replace('Carregando seus compromissos…','')+` ${S.mine.length} compromissos seus aparecem em cinza.`;
    render();
  }catch(err){msg.textContent=err.message}
}

  evs.forEach(e=>{const key=e.s+'|'+e.e;const r=rows[key]=rows[key]||{S:e.S,E:e.E,F:[],M:[],T:[]};for(const k of 'FMT')if(SEGSER[k].some(s=>e.ser.includes(s)))r[k].push(e)});

/* ---------- busca ---------- */
function search(q){
  const box=document.getElementById('sres');q=q.trim().toLowerCase();
  if(!q){box.hidden=true;return}
  const n=q.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const r=EVS.filter(e=>vis(e)&&(e.t+' '+e.sub+' '+(e.d||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(n)).sort((a,b)=>a.S-b.S).slice(0,60);
  box.innerHTML=r.length?r.map(e=>`<div class="r" data-goev="${e.id}"><span class="dt">${DS[wd(e.S)]} ${dd(e.S)}</span><span class="tag" style="--c:${e.col}"><i></i>${esc(e.t)}</span></div>`).join(''):'<div class="empty">Nenhum evento encontrado com os filtros atuais.</div>';
  box.hidden=false;
}

  if(e.key==='Escape'){closePop();document.getElementById('mbg')?.remove();document.body.classList.remove('sideopen')}
  if(S.info)return;
  if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);
  if(e.key==='t'||e.key==='T')goToday();
  const v={d:'dia',s:'semana',m:'mes',a:'ano'}[e.key.toLowerCase()];if(v){S.view=v;render()}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!S.info&&S.view==='mes')vMonth(document.getElementById('view'))},120)});

/* ---------- integração com o painel (mesmo site) ---------- */
(function(){
  try{
    if(window.parent!==window&&window.parent.document.getElementById('tabs')){
      document.body.classList.add('emb');
      const pr=window.parent.document.documentElement,sync=()=>{const t=pr.getAttribute('data-theme');t?document.documentElement.setAttribute('data-theme',t):document.documentElement.removeAttribute('data-theme')};
      sync();new MutationObserver(sync).observe(pr,{attributes:true,attributeFilter:['data-theme']});
    }
  }catch(e){}
})();
render();
</script>
